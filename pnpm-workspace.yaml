minimumReleaseAge: 0
enableGlobalVirtualStore: false

# PNPM workspace for packages/ and plasmicpkgs/
packages:
  - packages/*
  # Deprecated stub packages with no version
  - "!packages/loader-angular"
  - "!packages/loader-svelte"
  - "!packages/loader-vue"
  - "!packages/plasmic"
  - plasmicpkgs/*
  - plasmicpkgs/commerce-providers/*
  - plasmicpkgs-dev
  - platform/react-renderer
  # Vendored UI reference used by the React UI package.
  - vendor/react-ui

# Shared direct and toolchain dependencies. Keep compatibility ranges in
# peerDependencies; pnpm replaces catalog references when packing/publishing.
catalog:
  "@babel/core": "^7.29.0"
  "@babel/generator": "^7.29.8"
  "@babel/helpers": "^7.29.0"
  "@babel/parser": "^7.29.9"
  "@babel/preset-env": "^7.29.2"
  "@babel/preset-react": "^7.28.5"
  "@babel/preset-typescript": "^7.28.5"
  "@babel/traverse": "^7.29.8"
  "@babel/types": "^7.29.8"
  "@storybook/addon-essentials": "8.5.5"
  "@storybook/addon-interactions": "8.5.5"
  "@storybook/addon-links": "8.5.5"
  "@storybook/blocks": "8.5.5"
  "@storybook/channels": "8.5.5"
  "@storybook/components": "8.5.5"
  "@storybook/core-events": "8.5.5"
  "@storybook/manager-api": "8.5.5"
  "@storybook/preview-api": "8.5.5"
  "@storybook/react": "8.5.5"
  "@storybook/react-webpack5": "8.5.5"
  "@storybook/test": "8.5.5"
  "@storybook/theming": "8.5.5"
  "@testing-library/react": "16.3.3"
  "@types/debounce": "^1.2.4"
  "@types/dlv": "^1.1.5"
  "@types/findup-sync": "^2.0.2"
  "@types/glob": "^7.2.0"
  "@types/js-cookie": "^3.0.6"
  "@types/lodash": "^4.17.25"
  "@types/minimatch": "3.0.5"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@types/semver": "^7.8.0"
  "@vitest/coverage-v8": "4.1.10"
  dayjs: "1.11.23"
  eslint: "^8.55.0"
  jest: "29.7.0"
  lottie-web: ">=5.13.0"
  picomatch: "2.3.1"
  playwright: "1.60.0"
  playwright-core: "1.60.0"
  prettier: "3.9.9"
  react: "19.3.1"
  react-dom: "19.3.1"
  rollup-plugin-dts: "^6.5.1"
  rollup-plugin-esbuild: "^6.2.1"
  rollup-plugin-replace-imports: "^1.0.0"
  rollup-plugin-typescript2: "^0.37.0"
  sha.js: "^2.4.12"
  storybook: "8.5.5"
  tsdx: "^0.14.1"
  tslib: "^2.6.2"
  tsup: "^7.2.0"
  tsx: "^4.23.13"
  typescript: "5.9.3"
  vite: "8.1.5"
  vitest: "4.1.10"

overrides:
  eslint: "catalog:"
  jest: "catalog:"
  # Pins before releases that don't work for us
  sha.js: "catalog:"
  "@babel/helpers": "catalog:"
  "@types/minimatch": "catalog:"
  "tsdx>rollup-plugin-typescript2": "catalog:"
  # TSDX loads this plugin in its builds; Jest 29 dedent requires macros 3.
  "tsdx@0.14.1>babel-plugin-macros": "3.1.0"
  # Keep TSDX and its Jest transformer on the SDK compiler.
  "tsdx@0.14.1>typescript": "catalog:"
  "ts-jest@25.5.1>typescript": "catalog:"
  dayjs: "catalog:"
  "picomatch@2": "catalog:"
  "lottie-web": "catalog:"
  # Only pulled in transitively (@storybook/test-runner, jest-playwright-preset),
  # both with open ranges, so this would otherwise float to whatever is latest at
  # resolve time. Pin it to the version platform/wab, platform/wab/playwright
  # and platform/loader-tests use, so the runner image only pre-installs one set
  # of browsers (devops/manual/runner-image).
  playwright: "catalog:"
  playwright-core: "catalog:"
  "@react-aria/focus": "3.20.3"
  "@react-aria/overlays": "3.27.1"
  "@react-types/overlays": "3.8.15"
  "react-slick": "0.31.0"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: false
  lmdb: true
  msw: true
  nx: true
  # dev-only transitive (Next.js), don't build in CI/CD
  sharp: false
  unrs-resolver: true

shamefullyHoist: true
# Link local workspace packages even when referenced by plain version range.
linkWorkspacePackages: deep
preferWorkspacePackages: true

# Preserve controlled canvas behavior in components linked from the platform.
patchedDependencies:
  "@react-aria/focus@3.20.3": platform/patches/@react-aria__focus.patch
  "@react-aria/overlays@3.27.1": platform/patches/@react-aria__overlays.patch
  "react-slick@0.31.0": platform/patches/react-slick.patch
