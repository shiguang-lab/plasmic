name: Build selected Plasmic resources
on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      source-ref:
        required: true
        type: string
      cli-version:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.12'
      - run: node --test desktop/tests/plasmic-resources.test.cjs
      - name: Build resources with the verified npm CLI
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          CLI_VERSION: ${{ inputs.cli-version }}
        run: node scripts/release-resources.mjs --tag "$RELEASE_TAG" --cli-version "$CLI_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: plasmic-resources-${{ inputs.release-tag }}
          path: dist/plasmic-resources/
          if-no-files-found: error
          compression-level: 0
