name: Build selected Plasmic resources
on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      source-ref:
        required: true
        type: string
      prepared-cli:
        default: false
        type: boolean
      cli-version:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.12'
      - run: node --test desktop/tests/plasmic-resources.test.cjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.prepared-cli
        with:
          name: plasmic-cli
          path: dist/plasmic-cli
      - name: Bundle the prepared CLI or reuse the active Plasmic archive
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          CLI_VERSION: ${{ inputs.cli-version }}
          PREPARED_CLI: ${{ inputs.prepared-cli }}
        run: |
          args=()
          if [[ "$PREPARED_CLI" == "true" ]]; then args+=(--artifact dist/plasmic-cli/plasmic-cli.tgz); fi
          node scripts/release-resources.mjs --tag "$RELEASE_TAG" --cli-version "$CLI_VERSION" "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: plasmic-resources-${{ inputs.release-tag }}
          path: dist/plasmic-resources/
          if-no-files-found: error
          compression-level: 0
