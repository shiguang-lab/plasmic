name: Build Desktop installers
on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ""
      source-ref:
        description: Verified release commit to build
        required: true
        type: string
      renderer-prepared:
        description: The caller uploaded a renderer from its Studio build
        type: boolean
        default: false
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  renderer:
    if: '!inputs.renderer-prepared'
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux Canvas build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: npm ci --prefix desktop --prefer-offline --no-audit --no-fund
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("desktop/package.json")); if((process.env.RELEASE_TAG && process.env.RELEASE_TAG!==p.version) || !/^\d+\.\d+\.\d+$/.test(p.version)) throw new Error("Tag/version mismatch")'
      - name: Extract the pinned Studio image
        run: node desktop/scripts/prepare-assets.mjs
      - run: tar -czf renderer.tar.gz -C desktop renderer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: desktop-renderer
          path: renderer.tar.gz
          if-no-files-found: error
          compression-level: 0
  installers:
    needs: renderer
    if: >-
      ${{ !cancelled() &&
          (needs.renderer.result == 'success' ||
           (inputs.renderer-prepared && needs.renderer.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    # A cold Intel build compiles llama.cpp before signing and packaging.
    timeout-minutes: ${{ matrix.runner == 'macos-15-intel' && 60 || 30 }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux Canvas build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Install macOS Canvas build dependencies
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install pkg-config cairo pango libpng jpeg giflib librsvg pixman
      - run: npm ci --prefix desktop --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          name: desktop-renderer
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: desktop/mcp/go.mod
          cache-dependency-path: desktop/mcp/go.sum
      - run: tar -xzf renderer.tar.gz -C desktop
      - uses: ./.github/actions/desktop-runtime-cache
        id: runtime-cache
        with:
          runner: ${{ matrix.runner }}
          target: ${{ matrix.platform }}-${{ matrix.arch }}
      - name: Prepare native component runtime
        run: node desktop/scripts/prepare-component-reuse.mjs '${{ matrix.platform }}' '${{ matrix.arch }}'
      - name: Save native component runtime
        if: steps.runtime-cache.outputs.hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.runtime-cache.outputs.path }}
          key: ${{ steps.runtime-cache.outputs.key }}
      - name: Build Go MCP helper
        run: node desktop/scripts/build-mcp.mjs '${{ matrix.platform }}' '${{ matrix.arch }}'
      - name: Install Electron before native verification
        run: |
          for attempt in 1 2 3; do
            node desktop/node_modules/electron/install.js && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Use Electron package checksums for packaging
        run: |
          node -e 'require("node:fs").writeFileSync("desktop/electron-builder.json", JSON.stringify({ electronDownload: { force: false, checksums: require("./desktop/node_modules/electron/checksums.json") } }))'
      - name: Test Desktop on macOS
        if: matrix.platform == 'darwin' && matrix.arch == 'x64'
        run: npm --prefix desktop --ignore-scripts test
      - name: Verify expired-session startup
        if: matrix.platform == 'darwin'
        run: npm run test:auth-startup --prefix desktop
      - name: Verify unavailable-project startup
        if: matrix.platform == 'darwin'
        run: npm run test:workspace-startup --prefix desktop
      - name: Verify background workers and public draft bridge
        if: matrix.platform == 'darwin'
        run: npm --prefix desktop --ignore-scripts run test:background
      - name: Verify packaged background process lifecycle
        if: matrix.platform == 'darwin'
        run: npm run test:background-packaged --prefix desktop
      - name: Verify file-based sign-in across a packaged upgrade
        if: matrix.platform == 'darwin'
        run: npm run test:session-lifecycle --prefix desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always() && matrix.platform == 'darwin'
        with:
          name: session-lifecycle-${{ matrix.arch }}
          path: desktop/desktop-report/session-lifecycle/
          if-no-files-found: ignore
      - name: Package native installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          version=$(node -p 'require("./desktop/package.json").version')
          echo "DESKTOP_VERSION=$version" >> "$GITHUB_ENV"
          node desktop/scripts/package.mjs '${{ matrix.platform }}' '${{ matrix.arch }}' --prepared-mcp --notes "desktop/release-notes/$version.md"
      - name: Validate native installer
        run: |
          version="$DESKTOP_VERSION"
          node --input-type=module -e 'import { validateRelease } from "./desktop/scripts/release-artifacts.mjs"; const [platform, arch, version] = process.argv.slice(1); await validateRelease(`desktop/dist/${version}/${platform}-${arch}`, platform, version, arch);' '${{ matrix.platform }}' '${{ matrix.arch }}' "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/${{ env.DESKTOP_VERSION }}/${{ matrix.platform }}-${{ matrix.arch }}/Plasmic-*
            desktop/dist/${{ env.DESKTOP_VERSION }}/${{ matrix.platform }}-${{ matrix.arch }}/latest*.yml
          if-no-files-found: error
          compression-level: 0
