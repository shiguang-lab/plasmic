name: Build Desktop installers
on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ""
      source-ref:
        description: Verified release commit to build
        required: true
        type: string
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
  actions: read
jobs:
  renderer:
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux Canvas build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: npm ci --prefix desktop --prefer-offline --no-audit --no-fund
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("desktop/package.json")); if((process.env.RELEASE_TAG && process.env.RELEASE_TAG!==p.version) || !Object.values((await import("./desktop/src/release-version.cjs")).default).some(pattern => pattern.test(p.version))) throw new Error("Tag/version mismatch")'
      - name: Extract the pinned Studio image
        run: node desktop/scripts/prepare-assets.mjs
      - run: tar -czf renderer.tar.gz -C desktop renderer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: desktop-renderer
          path: renderer.tar.gz
          if-no-files-found: error
          compression-level: 0
  installers:
    needs: renderer
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
    uses: ./.github/workflows/build-desktop-installer.yml
    with:
      source-ref: ${{ inputs.source-ref }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      renderer-run-id: ${{ github.run_id }}
      artifact-name: ${{ matrix.platform }}-${{ matrix.arch }}
  arm-installer:
    needs: renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: write
    steps:
      # Orchestration belongs to the workflow revision; application code stays
      # pinned to source-ref, including when republishing an older release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
      - run: node --test scripts/desktop-arm-race.test.mjs
      - name: Start both ARM builds
        id: race
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source-ref }}
        run: node scripts/desktop-arm-race.mjs dispatch
      - name: Select the first verified ARM installer
        id: winner
        env:
          GH_TOKEN: ${{ github.token }}
          ARM_RUN_ID: ${{ steps.race.outputs.run-id }}
        run: node scripts/desktop-arm-race.mjs wait
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          artifact-ids: ${{ steps.winner.outputs.artifact-id }}
          run-id: ${{ steps.race.outputs.run-id }}
          github-token: ${{ github.token }}
          path: arm-installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: darwin-arm64
          path: arm-installer/
          if-no-files-found: error
          compression-level: 0
      - name: Stop the remaining ARM attempt
        if: always() && steps.race.outputs.run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARM_RUN_ID: ${{ steps.race.outputs.run-id }}
        run: node scripts/desktop-arm-race.mjs cancel
