name: Publish Desktop installers and release image
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing Desktop release tag to build
        required: true
        type: string
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      source-ref:
        description: Studio commit to build before the linked Desktop tag exists
        required: true
        type: string
      tested-revision:
        description: Commit that already passed the caller's Desktop tests
        required: true
        type: string
env:
  PYTHONUTF8: "1"
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'shiguang-lab/plasmic'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.source-ref || inputs.release-tag || github.ref }}
          fetch-depth: 0
      - id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
      - id: plan
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
        run: node scripts/release-plan.mjs "$RELEASE_TAG"
      - name: Record the linked Desktop tag
        if: inputs.release-tag != '' && steps.plan.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
  tests:
    needs: plan
    if: needs.plan.outputs.publish == 'true' && inputs.tested-revision != needs.plan.outputs.revision
    uses: ./.github/workflows/test-desktop.yml
    with:
      source-ref: ${{ needs.plan.outputs.revision }}
  renderer:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ needs.plan.outputs.revision }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop --prefer-offline --no-audit --no-fund
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("desktop/package.json")); if(process.env.RELEASE_TAG!==`desktop-v${p.version}` || !/^\d+\.\d+\.\d+$/.test(p.version)) throw new Error("Tag/version mismatch")'
      - name: Extract the pinned Studio image
        run: node desktop/scripts/prepare-assets.mjs
      - run: tar -czf renderer.tar.gz -C desktop renderer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: desktop-renderer
          path: renderer.tar.gz
          if-no-files-found: error
          compression-level: 0
  installers:
    needs: [plan, renderer]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: windows-2025
            platform: win32
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ needs.plan.outputs.revision }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          name: desktop-renderer
      - run: tar -xzf renderer.tar.gz -C desktop
      - name: Verify expired-session startup
        if: matrix.platform == 'darwin'
        run: npm run test:auth-startup --prefix desktop
      - name: Verify unavailable-project startup
        if: matrix.platform == 'darwin'
        run: npm run test:workspace-startup --prefix desktop
      - name: Verify file-based sign-in across a packaged upgrade
        if: matrix.platform == 'darwin'
        run: npm run test:session-lifecycle --prefix desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always() && matrix.platform == 'darwin'
        with:
          name: session-lifecycle-${{ matrix.arch }}
          path: desktop/desktop-report/session-lifecycle/
          if-no-files-found: ignore
      - name: Package native installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          version=$(node -p 'require("./desktop/package.json").version')
          echo "DESKTOP_VERSION=$version" >> "$GITHUB_ENV"
          node desktop/scripts/package.mjs '${{ matrix.platform }}' '${{ matrix.arch }}' --notes "desktop/release-notes/$version.md"
          node --input-type=module -e 'import { validateRelease } from "./desktop/scripts/release-artifacts.mjs"; const [platform, arch, version] = process.argv.slice(1); await validateRelease(`desktop/dist/${version}/${platform}-${arch}`, platform, version, arch);' '${{ matrix.platform }}' '${{ matrix.arch }}' "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/${{ env.DESKTOP_VERSION }}/${{ matrix.platform }}-${{ matrix.arch }}/Plasmic-*
            desktop/dist/${{ env.DESKTOP_VERSION }}/${{ matrix.platform }}-${{ matrix.arch }}/latest*.yml
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: [plan, tests, installers]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.publish == 'true' &&
          needs.installers.result == 'success' &&
          (needs.tests.result == 'success' ||
           (needs.tests.result == 'skipped' && inputs.tested-revision == needs.plan.outputs.revision)) }}
    env:
      RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ needs.plan.outputs.revision }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop --omit=dev --ignore-scripts --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          pattern: '{darwin-arm64,darwin-x64,win32-x64,linux-x64}'
          path: installers
          merge-multiple: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1, Node 24
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0, Node 24
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate unpublished release
        run: |
          if docker manifest inspect "ghcr.io/shiguang-lab/plasmic-desktop-releases:$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release image already exists; publish a new version.' >&2
            exit 1
          fi
      - name: Validate installers and generate public JSON
        run: node desktop/scripts/build-distribution.mjs --from installers --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: desktop-distribution
          path: desktop/public/desktop-updates/latest.json
          if-no-files-found: error
      - name: Publish static release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0, Node 24
        with:
          context: .
          file: desktop/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/shiguang-lab/plasmic-desktop-releases:${{ inputs.release-tag || github.ref_name }}
            ghcr.io/shiguang-lab/plasmic-desktop-releases:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.revision }}
            org.opencontainers.image.version=${{ inputs.release-tag || github.ref_name }}
