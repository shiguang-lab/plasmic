name: Test Desktop on supported operating systems
on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
    outputs:
      revision:
        description: Commit verified by every test runner
        value: ${{ jobs.tests.outputs.revision }}
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.source-ref }}
      - id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop --prefer-offline --no-audit --no-fund
      - run: npm test --prefix desktop
