name: Test Desktop on Linux and Windows
on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
    outputs:
      revision:
        description: Commit verified by every test runner
        value: ${{ jobs.tests.outputs.revision }}
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.source-ref }}
      - id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux Canvas build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: npm ci --prefix desktop --prefer-offline --no-audit --no-fund
      - name: Install Electron before parallel tests
        run: |
          for attempt in 1 2 3; do
            node desktop/node_modules/electron/install.js && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: desktop/mcp/go.mod
          cache-dependency-path: desktop/mcp/go.sum
      - run: npm test --prefix desktop
