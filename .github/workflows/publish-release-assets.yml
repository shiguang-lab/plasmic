name: Publish existing release artifacts
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Numeric version tag whose builds already succeeded
        required: true
        type: string
      artifact-run-id:
        description: Publish release run containing the verified artifacts
        required: true
        type: string
      force-all:
        description: Match a source run that explicitly forced all products
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
concurrency:
  group: product-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'shiguang-lab/plasmic' && inputs.release-tag == '0.8.5' && inputs.artifact-run-id == '43246249602' && !inputs.force-all
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          path: automation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.release-tag }}
          fetch-depth: 0
          path: source
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
      - name: Verify artifact source and successful builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const runId=process.env.ARTIFACT_RUN_ID;
          if(!/^\d+$/.test(runId))throw new Error('Invalid artifact run ID');
          const api=endpoint=>JSON.parse(execFileSync('gh',['api',endpoint],{encoding:'utf8'}));
          const base=`repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}`;
          const run=api(base);
          const revision=execFileSync('git',['-C','source','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(revision!=='4a20aa1d43b585e3ce12a5114477995636ecd400'||run.head_sha!=='0ec4e5e2b81f6819e457d6e37397013ea4b91662'||run.path!=='.github/workflows/publish-images.yml'||run.status!=='completed')throw new Error('Expected the completed recovery build for 0.8.5');
          const {jobs}=api(base+'/jobs?per_page=100');
          const required=['plan','studio','desktop-tests / tests (ubuntu-24.04)','desktop-tests / tests (windows-2025)','desktop / renderer','desktop / installers (macos-15-intel, darwin, x64)','desktop / installers (windows-2025, win32, x64)','desktop / installers (ubuntu-24.04, linux, x64)'];
          for (const name of required) if(!jobs.some(job=>job.name===name&&job.conclusion==='success'))throw new Error(`Missing successful job: ${name}`);
          if(!jobs.some(job=>job.name==='desktop / installers (macos-15, darwin, arm64)'&&job.conclusion==='cancelled'&&!job.runner_name))throw new Error('Local arm64 recovery requires a cancelled job that never acquired a runner');
          JS
      - id: plan
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_FORCE_ALL: ${{ inputs.force-all == true }}
        run: node scripts/release-plan.mjs "$RELEASE_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        if: steps.plan.outputs.desktop == 'true' || steps.plan.outputs.resources == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifact-run-id }}
          pattern: '{darwin-x64,win32-x64,linux-x64}'
          path: source/release-artifacts
          merge-multiple: false
      - name: Verify the local arm64 build from the draft and assemble the release
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view 0.8.5 --json isDraft --jq .isDraft)" = true
          staged=plasmic-0.8.5-darwin-arm64-staged.tar
          gh release download 0.8.5 --pattern "$staged" --dir release-artifacts
          archive="release-artifacts/$staged"
          printf '%s  %s\n' '073c016f86031ea313b985b43f1702b9d1541e4eec610658aef82e83e5afd13d' "$archive" | sha256sum -c -
          expected=$(printf '%s\n' Plasmic-0.8.5-mac-arm64.{dmg,dmg.blockmap,zip,zip.blockmap} latest-mac.yml | sort)
          test "$(tar -tf "$archive" | sort)" = "$expected"
          mkdir release-artifacts/darwin-arm64
          tar -xf "$archive" -C release-artifacts/darwin-arm64
          npm ci --prefix desktop --omit=dev --ignore-scripts --prefer-offline --no-audit --no-fund
          node desktop/scripts/build-distribution.mjs --from release-artifacts --output release-artifacts/desktop-distribution --tag 0.8.5 --manifests-only
          gh release delete-asset 0.8.5 "$staged" --yes
      - name: Publish verified artifacts using the current release publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ROOT: ${{ github.workspace }}/source
          RELEASE_PLAN: ${{ steps.plan.outputs.plan }}
        run: node automation/scripts/github-release.mjs
