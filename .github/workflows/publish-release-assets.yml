name: Publish existing release artifacts
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Numeric version tag whose builds already succeeded
        required: true
        type: string
      artifact-run-id:
        description: Publish release run containing the verified artifacts
        required: true
        type: string
      force-all:
        description: Match a source run that explicitly forced all products
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
concurrency:
  group: product-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'shiguang-lab/plasmic'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          path: automation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ inputs.release-tag }}
          fetch-depth: 0
          path: source
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
      - name: Verify artifact source and successful builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const runId=process.env.ARTIFACT_RUN_ID;
          if(!/^\d+$/.test(runId))throw new Error('Invalid artifact run ID');
          const api=endpoint=>JSON.parse(execFileSync('gh',['api',endpoint],{encoding:'utf8'}));
          const base=`repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${runId}`;
          const run=api(base);
          const revision=execFileSync('git',['-C','source','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(run.head_sha!==revision||run.path!=='.github/workflows/publish-images.yml'||run.status!=='completed')throw new Error('Artifact run must be the completed release build for this tag commit');
          const jobs=api(base+'/jobs?per_page=100');
          if(jobs.total_count>100||!jobs.jobs.length||jobs.jobs.some(job=>job.name!=='release'&&!['success','skipped'].includes(job.conclusion)))throw new Error('Every source build and test must succeed before publishing its artifacts');
          JS
      - id: plan
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_FORCE_ALL: ${{ inputs.force-all == true }}
        run: node scripts/release-plan.mjs "$RELEASE_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        if: steps.plan.outputs.desktop == 'true' || steps.plan.outputs.resources == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifact-run-id }}
          pattern: '{darwin-arm64,darwin-x64,win32-x64,linux-x64,desktop-distribution,plasmic-cli,plasmic-resources-*}'
          path: source/release-artifacts
          merge-multiple: false
      - name: Publish verified artifacts using the current release publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ROOT: ${{ github.workspace }}/source
          RELEASE_PLAN: ${{ steps.plan.outputs.plan }}
        run: node automation/scripts/github-release.mjs
