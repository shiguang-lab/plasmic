name: Publish NAS images
on:
  push:
    tags: ['*']
permissions:
  contents: read
  packages: write
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'shiguang-lab/plasmic'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [server, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ${{ matrix.target }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/shiguang-lab/plasmic-${{ matrix.target }}:${{ github.ref_name }}
          build-args: PLASMIC_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=plasmic-${{ matrix.target }}
          cache-to: type=gha,mode=min,scope=plasmic-${{ matrix.target }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
