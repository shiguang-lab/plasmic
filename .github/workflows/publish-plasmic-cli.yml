name: Publish changed Plasmic CLI

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: plasmic-cli-release
  cancel-in-progress: false

jobs:
  publish-cli:
    if: github.repository == 'shiguang-lab/plasmic'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Validate release tag and verify CLI
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import {releaseVersion} from "./packages/plasmic-cli/scripts/publish.mjs"; releaseVersion(process.env.RELEASE_TAG.replace(/^cli-v/, ""))'
          npm install -g npm@latest
          npm --prefix packages/plasmic-cli test
      - name: Publish CLI only when package contents change
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node packages/plasmic-cli/scripts/publish.mjs --tag "$RELEASE_TAG" --execute
