name: Publish Plasmic CLI and package resources

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: plasmic-cli-release
  cancel-in-progress: false

jobs:
  publish-cli:
    if: github.repository == 'shiguang-lab/plasmic'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify structural and Form gates before release
        run: python3 -m unittest discover -s ai/plasmic/scripts -p 'test_*.py'
      - name: Validate release tag and verify CLI
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import {releaseVersion} from "./packages/plasmic-cli/scripts/publish.mjs"; releaseVersion(process.env.RELEASE_TAG)'
          npm install -g npm@latest
          npm --prefix packages/plasmic-cli test
          node --test desktop/tests/plasmic-resources.test.cjs
      - name: Publish versioned CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node packages/plasmic-cli/scripts/publish.mjs --tag "$RELEASE_TAG" --execute
      - uses: actions/upload-artifact@v4
        with:
          name: plasmic-resources-${{ github.ref_name }}
          path: dist/plasmic-resources/
          if-no-files-found: error
