name: Check Plasmic resource gates

on:
  pull_request:
    paths:
      - '.eslintrc.js'
      - 'scripts/react19-lint.test.cjs'
      - 'ai/plasmic/**'
      - 'scripts/build-plasmic-resources.mjs'
      - 'scripts/validate-plasmic-*.mjs'
      - 'scripts/plasmic-cli-artifact.mjs'
      - 'scripts/release-*.mjs'
      - 'scripts/github-release*.mjs'
      - 'scripts/test-fixtures/**'
      - '.github/workflows/publish-*.yml'
      - 'packages/plasmic-cli/**'
      - 'plasmicpkgs/antd6/**'
      - 'plasmicpkgs/antd5/**'
      - 'plasmicpkgs/overseas/**'
      - 'plasmicpkgs/react-ui/**'
      - 'plasmicpkgs/antd-icons/**'
      - 'desktop/tests/plasmic-resources.test.cjs'
      - '.github/workflows/*plasmic*.yml'
  push:
    branches: [master, main]
    paths:
      - '.eslintrc.js'
      - 'scripts/react19-lint.test.cjs'
      - 'ai/plasmic/**'
      - 'scripts/build-plasmic-resources.mjs'
      - 'scripts/validate-plasmic-*.mjs'
      - 'scripts/plasmic-cli-artifact.mjs'
      - 'scripts/release-*.mjs'
      - 'scripts/github-release*.mjs'
      - 'scripts/test-fixtures/**'
      - '.github/workflows/publish-*.yml'
      - 'packages/plasmic-cli/**'
      - 'plasmicpkgs/antd6/**'
      - 'plasmicpkgs/antd5/**'
      - 'plasmicpkgs/overseas/**'
      - 'plasmicpkgs/react-ui/**'
      - 'plasmicpkgs/antd-icons/**'
      - 'desktop/tests/plasmic-resources.test.cjs'
      - '.github/workflows/*plasmic*.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.12'
      - name: Verify structural and Form gates
        run: |
          python3 -m unittest discover -s ai/plasmic/scripts -p 'test_*.py'
          python3 -B -m unittest discover -s ai/plasmic/evals -p 'test_*.py'
      - name: Verify resource packaging and publication
        run: |
          node --test scripts/release-plan.test.mjs scripts/github-release.test.mjs scripts/release-downloads.test.mjs
          node --test scripts/validate-plasmic-component-coverage.test.mjs
          npm --prefix packages/plasmic-cli test
          node --test desktop/tests/plasmic-resources.test.cjs
      - name: Verify fixed download routing with Caddy
        run: node --test scripts/release-downloads.integration.test.mjs

  source-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
      - name: Install component dependencies
        run: |
          npm install --global pnpm@11.10.0
          pnpm install --frozen-lockfile
      - name: Verify React lint rules with repository dependencies
        run: node --test scripts/react19-lint.test.cjs
      - name: Build component dependencies
        run: pnpm --filter '@plasmicpkgs/antd5^...' --filter '@shiguang-lab/plasmic-react-ui^...' -r run build
      - name: Verify live source registrations against references
        run: node scripts/validate-plasmic-component-coverage.mjs
