name: plasmic-canvas-snapshot
services:
  canvas-snapshot-page:
    image: ghcr.io/shiguang-lab/plasmic-server:${IMAGE_TAG:?}
    entrypoint: ["node", "/snapshot/studio.cjs"]
    restart: unless-stopped
    environment:
      CANVAS_ORIGIN: ${CANVAS_ORIGIN:?}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./covers:/covers:ro
      - ./jobs:/jobs
      - ./secrets/db:/run/secrets/reader-password:ro
      - ./secrets/key:/run/secrets/snapshot-key:ro
    networks: [studio]
  canvas-screenshot:
    image: ghcr.io/shiguang-lab/plasmic-cover-worker:${IMAGE_TAG:?}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      STUDIO_ORIGIN: http://edge:8080
      STUDIO_ASSET_ORIGINS: ${STUDIO_ORIGIN:?},${CANVAS_ORIGIN:?}
    volumes:
      - ./secrets/key:/run/secrets/snapshot-key:ro
      - ./covers:/covers
      - ./jobs:/jobs
      - /etc/fonts:/etc/fonts:ro
      - /usr/share/fonts:/usr/share/fonts:ro
      - /var/cache/fontconfig:/var/cache/fontconfig:ro
    networks: [studio]
networks:
  studio:
    external: true
    name: shiguang-plasmic-images_default
