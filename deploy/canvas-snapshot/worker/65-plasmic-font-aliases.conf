<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Accept open-source fallbacks when proprietary desktop fonts are absent, while still preferring host-mounted fonts if present. -->
  <alias><family>Helvetica Neue</family><accept><family>Liberation Sans</family></accept></alias>
  <alias><family>Segoe UI</family><accept><family>Liberation Sans</family></accept></alias>
  <alias><family>SF Pro Text</family><accept><family>Liberation Sans</family></accept></alias>
  <alias><family>SF Pro Display</family><accept><family>Liberation Sans</family></accept></alias>
  <alias><family>SF Pro Rounded</family><accept><family>Liberation Sans</family></accept></alias>
  <alias><family>SF Compact Text</family><accept><family>Liberation Sans</family></accept></alias>
  <alias><family>SF Compact Display</family><accept><family>Liberation Sans</family></accept></alias>
  <alias><family>SF Mono</family><accept><family>Liberation Mono</family></accept></alias>
  <alias><family>PingFang SC</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>Hiragino Sans GB</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>Microsoft YaHei</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>SimHei</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>DengXian</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias><family>SimSun</family><accept><family>Noto Serif CJK SC</family></accept></alias>
</fontconfig>
