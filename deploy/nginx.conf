map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https https;
  http http;
}
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 20m;
  location /api/ {
    proxy_pass http://server:3004;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }
  location = /healthcheck { proxy_pass http://server:3004/healthcheck; }
  # Only content-addressed image objects can be fetched; no filer listing/writes.
  location ~ "^/assets/([a-f0-9]{32}\.[a-zA-Z0-9]+)$" {
    resolver 127.0.0.11 valid=30s;
    add_header Access-Control-Allow-Origin "*" always;
    set $object_path /buckets/plasmic-site-assets/$1;
    proxy_pass http://storage:8888$object_path;
    limit_except GET { deny all; }
  }
  location /assets/ { return 404; }
  location /static/ {
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }
  location / { try_files $uri /index.html; }
}
server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/html;
  add_header Access-Control-Allow-Origin "*" always;
  location /static/ { try_files $uri =404; }
  location / { return 404; }
}
