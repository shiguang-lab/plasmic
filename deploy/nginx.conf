map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https https;
  http http;
}
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
map $hostname $backend_server {
  default server:3004;
  web-next server-next:3004;
}
map $hostname $preview_server {
  default preview:3011;
  web-next preview-next:3011;
}
log_format plasmic escape=json
  '{"time":"$time_iso8601","requestId":"$http_x_sg_request_id",'
  '"method":"$request_method","host":"$host","path":"$uri",'
  '"status":$status,"requestTime":$request_time,'
  '"upstreamConnectTime":"$upstream_connect_time",'
  '"upstreamResponseTime":"$upstream_response_time",'
  '"upstreamStatus":"$upstream_status"}';
access_log /dev/stdout plasmic;
resolver 127.0.0.11 valid=5s ipv6=off;
map $uri $static_cache_control {
  default "no-cache";
  "~^/static/host\.[a-f0-9]{64}\.html$" "public, max-age=31536000, immutable";
  "~*\.[a-f0-9]{6,}\.(js|css|woff2?|png|svg|jpg|jpeg|gif|webp)$" "public, max-age=31536000, immutable";
}
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types application/javascript text/css application/json image/svg+xml;
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 20m;
  location /desktop-updates/ { return 404; }
  location /api/ {
    proxy_pass http://$backend_server;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }
  location = /healthcheck { proxy_pass http://$backend_server; }
  # Only content-addressed image objects can be fetched; no filer listing/writes.
  location ~ "^/assets/([a-f0-9]{32}\.[a-zA-Z0-9]+)$" {
    resolver 127.0.0.11 valid=30s;
    add_header Access-Control-Allow-Origin "*" always;
    set $object_path /buckets/plasmic-site-assets/$1;
    proxy_pass http://storage:8888$object_path;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    limit_except GET { deny all; }
  }
  location /assets/ { return 404; }
  location /static/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control $static_cache_control;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/html;
  add_header Access-Control-Allow-Origin "*" always;
  location /static/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control $static_cache_control;
    try_files $uri =404;
  }
  location / { return 404; }
}

# Public websites have a separate origin and no Studio API or canvas access.
server {
  listen 8082;
  server_name _;
  location / {
    resolver 127.0.0.11 valid=30s;
    proxy_pass http://$preview_server;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 300s;
  }
}
