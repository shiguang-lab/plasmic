map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https https;
  http http;
}
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
map $uri $static_cache_control {
  default "no-cache";
  "~*\.[a-f0-9]{6,}\.(js|css|woff2?|png|svg|jpg|jpeg|gif|webp)$" "public, max-age=31536000, immutable";
}
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types application/javascript text/css application/json image/svg+xml;
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 20m;
  # Update manifests must revalidate; versioned artifacts are immutable.
  location = /desktop-updates/plasmic/latest.json {
    root /srv;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    try_files $uri =404;
    limit_except GET { deny all; }
  }
  location ~ ^/desktop-updates/(darwin|win32|linux)/(arm64|x64)/(latest(-mac|-linux(-arm64)?)?\.yml)$ {
    root /srv;
    add_header Cache-Control "no-store" always;
    default_type text/yaml;
    try_files $uri =404;
    limit_except GET { deny all; }
  }
  location /desktop-updates/ {
    root /srv;
    add_header Cache-Control "public, max-age=31536000, immutable";
    default_type application/octet-stream;
    autoindex off;
    try_files $uri =404;
    limit_except GET { deny all; }
  }
  location /api/ {
    proxy_pass http://server:3004;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }
  location = /healthcheck { proxy_pass http://server:3004/healthcheck; }
  # Only content-addressed image objects can be fetched; no filer listing/writes.
  location ~ "^/assets/([a-f0-9]{32}\.[a-zA-Z0-9]+)$" {
    resolver 127.0.0.11 valid=30s;
    add_header Access-Control-Allow-Origin "*" always;
    set $object_path /buckets/plasmic-site-assets/$1;
    proxy_pass http://storage:8888$object_path;
    limit_except GET { deny all; }
  }
  location /assets/ { return 404; }
  location /static/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control $static_cache_control;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/html;
  add_header Access-Control-Allow-Origin "*" always;
  location /static/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control $static_cache_control;
    try_files $uri =404;
  }
  location / { return 404; }
}
