<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in to Plasmic</title>
    <style>
      :root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#1d2536; background:#f7f8fa; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; }
      .login-content { width:min(520px,100%); text-align:center; }
      .logo { width:56px; height:34px; display:block; margin:0 auto 24px; }
      .eyebrow { margin:0 0 10px; color:#929baa; font-size:11px; line-height:16px; letter-spacing:1.3px; }
      h1 { font-size:22px; font-weight:650; line-height:1.4; letter-spacing:-.4px; margin:0 0 12px; }
      p { font-size:13px; color:#758094; line-height:1.75; margin:0; }
      .status { display:flex; justify-content:center; align-items:center; gap:8px; margin:24px 0; color:#9099a8; font-size:12px; }
      .spinner { width:14px; height:14px; border:2px solid #e8edf4; border-top-color:#1677ff; border-radius:50%; animation:spin 1s linear infinite; }
      button { font:500 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; cursor:pointer; height:34px; padding:0 13px; border:1px solid #e2e6ed; border-radius:7px; background:#fff; color:#4d586b; transition:background .15s; }
      button:hover { background:#f7f8fa; }
      button.primary { background:#1677ff; border-color:#1677ff; color:white; }
      button.primary:hover { background:#0966e8; }
      button:focus-visible { outline:3px solid #1677ff40; outline-offset:2px; }
      button:disabled { opacity:.45; cursor:default; }
      .actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
      .hint { margin:24px 0 16px; font-size:12px; color:#929baa; }
      button.back { height:24px; padding:0 8px; border:0; color:#8590a2; background:none; font-weight:400; font-size:12px; }
      button.back:hover { color:#1677ff; }
      #link { margin-top:14px; width:100%; padding:8px 10px; border:1px solid #e8ebf0; border-radius:6px; background:#f9fafc; color:#667085; font:11px/1.5 ui-monospace,monospace; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @media (prefers-reduced-motion:reduce) { .spinner { animation:none; } }
      [hidden] { display:none!important; }
    </style>
  </head>
  <body>
    <main class="login-content">
      <svg class="logo" viewBox="0 0 80 48" aria-hidden="true"><defs><linearGradient id="brand"><stop stop-color="#f44ab4"/><stop offset="1" stop-color="#8956ff"/></linearGradient></defs><g fill="none" stroke="url(#brand)" stroke-width="7"><path d="M7 43a33 33 0 0 1 66 0"/><path d="M20 43a20 20 0 0 1 40 0"/><path d="M33 43a7 7 0 0 1 14 0"/></g></svg>
      <p class="eyebrow">PLASMIC</p>
      <h1 id="title">Opening browser</h1>
      <p id="message" role="status">Complete Google sign-in in your browser.</p>
      <div class="status" id="status"><span id="spinner" class="spinner" aria-hidden="true"></span><span id="status-label">Connecting</span></div>
      <div class="actions">
        <button id="open" class="primary" disabled>Open browser</button
        ><button id="retry" class="primary" hidden>Try again</button
        ><button id="copy">Copy sign-in link</button>
      </div>
      <input id="link" aria-label="Sign-in link" readonly hidden />
      <p class="hint">You will return to the app automatically after authorization. If it does not open, use the button on the authorization page.</p>
      <button id="cancel" class="back">Back to sign-in</button>
    </main>
    <script>
      const api = window.desktopGoogleLogin;
      function render(state) {
        const failed = state.phase === "error",
          waiting = state.phase === "waiting";
        document.getElementById("title").textContent = failed
          ? "Sign-in incomplete"
          : state.phase === "success"
            ? "Signed in"
            : waiting
              ? "Continue sign-in in your browser"
              : "Opening browser";
        document.getElementById("message").textContent = failed
          ? state.message
          : waiting
            ? state.message || "Complete Google authorization in your browser to return to the desktop app."
            : state.phase === "success"
              ? "Returning to your workspace."
              : "Please wait while your default browser opens.";
        document.getElementById("status").hidden = failed;
        document.getElementById("status-label").textContent = state.phase === "success" ? "Returning to workspace" : waiting ? "Waiting for browser authorization" : "Connecting";
        if (!waiting || !state.copied) { document.getElementById("link").hidden = true; document.getElementById("link").value = ""; }
        document.getElementById("open").hidden = failed;
        document.getElementById("open").disabled = !waiting;
        document.getElementById("retry").hidden = !failed;
        document.getElementById("copy").hidden = !waiting;
        if (state.copied) {
          const link = document.getElementById("link");
          link.hidden = false;
          link.value = state.authorizationUrl;
          document.getElementById("message").textContent =
            "Sign-in link copied. Paste it into your browser to continue authorization.";
        }
      }
      api.onStatus(render);
      api.command("status").then(render);
      for (const [id, command] of [
        ["open", "open-browser"],
        ["retry", "retry"],
        ["cancel", "cancel"],
        ["copy", "copy-link"],
      ]) {
        document.getElementById(id).addEventListener("click", async () => {
          try {
            render(await api.command(command));
          } catch (error) {
            render({ phase: "error", message: error.message });
          }
        });
      }
    </script>
  </body>
</html>
