<!doctype html>
<html lang="en" data-ui-appearance="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
<title>Plasmic</title>
<link rel="stylesheet" href="island.css">
<script defer src="renderer-i18n.js"></script>
<script defer src="island-renderer.js"></script>
</head>
<body>
<div id="shell" data-expanded="false" tabindex="0" aria-haspopup="menu">
 <div id="capsule">
  <button id="capsule-handle" type="button" aria-haspopup="menu"><span aria-hidden="true" class="brand">◈</span><span id="project">Plasmic</span><span id="pill-context"></span><span id="queue" hidden></span><span class="dot" aria-hidden="true"></span></button>
  <button id="capsule-update" class="update-indicator" type="button" hidden></button>
 </div>
 <section id="card" inert aria-hidden="true">
  <div class="body">
   <header id="drag-handle" class="identity">
    <span class="brand" aria-hidden="true">◈</span><span id="page"></span>
    <span id="account-user"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="5" r="3"/><path d="M2 15v-2a6 6 0 0 1 12 0v2"/></svg><span id="user-name"></span></span>
    <button id="card-update" class="update-indicator" type="button" hidden></button>
   </header>
   <div class="main">
    <section class="info"><div id="left-statistics" class="statistics"></div></section>
    <section class="right">
     <div id="right-statistics" class="statistics" hidden></div>
     <div class="visual">
      <img id="mirror" alt="" draggable="false" hidden>
      <div id="feedback" aria-hidden="true" hidden></div>
      <div id="view-loading" aria-hidden="true" hidden><i class="skeleton-line"></i><i class="skeleton-line"></i><i class="skeleton-line"></i></div>
      <span id="unavailable" hidden></span><span id="stale" hidden></span>
     </div>
     <div id="account-empty" hidden></div>
     <button id="account-sign-in" type="button" hidden></button>
    </section>
   </div>
   <footer class="info-footer">
    <span class="preference"><span id="theme-icon" aria-hidden="true"></span><span id="theme-label"></span></span>
    <span class="preference"><span aria-hidden="true">文A</span><span id="language-label"></span></span>
    <div id="phase" role="status" aria-live="polite"><span id="phase-icon" aria-hidden="true"></span><span id="phase-text"></span><span id="stage-count" hidden></span><button id="issue-detail" type="button" hidden aria-describedby="issue-tooltip"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="7" cy="7" r="5.5"/><path d="M7 3.5v4M7 9v1"/></svg></button></div>
    <span id="app-version" hidden></span>
   </footer>
   <div id="issue-tooltip" role="tooltip" hidden></div>
  </div>
  <section id="update-panel" aria-labelledby="update-heading" hidden>
   <div class="update-header">
    <h2 id="update-heading"></h2>
    <div id="update-versions"></div>
    <button id="update-dismiss" type="button">×</button>
   </div>
   <div class="update-content">
    <div id="update-title" role="status" aria-live="polite"></div>
    <p id="update-description"></p>
   </div>
   <div class="update-footer">
    <progress id="update-progress" max="100" value="0" hidden></progress>
    <div class="update-actions"><button id="update-later" type="button"></button><button id="update-retry" type="button" hidden></button><button id="update-install" type="button" hidden></button></div>
   </div>
  </section>
 </section>
</div>
</body>
</html>
