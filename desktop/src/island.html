<!doctype html>
<html lang="en" data-ui-appearance="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
<title>Plasmic</title>
<link rel="stylesheet" href="island.css">
<script defer src="renderer-i18n.js"></script>
<script defer src="island-renderer.js"></script>
</head>
<body>
<div id="shell" data-expanded="false" tabindex="0" aria-haspopup="menu">
 <div id="capsule">
  <button id="capsule-handle" type="button" aria-haspopup="menu"><span aria-hidden="true" class="brand">◈</span><span id="project">Plasmic</span><span id="pill-context"></span><span id="queue" hidden></span><span class="dot" aria-hidden="true"></span></button>
  <button id="capsule-update" class="update-indicator" type="button" hidden></button>
 </div>
 <section id="card" inert aria-hidden="true">
  <div class="body">
   <section class="info" id="drag-handle">
    <div class="identity"><span id="page"></span><span id="context"></span><span id="account-presence" role="img" hidden><i aria-hidden="true"></i><span></span></span><button id="card-update" class="update-indicator" type="button" hidden></button></div>
    <div class="heading">
     <span id="account-avatar" aria-hidden="true" hidden></span>
     <div class="heading-copy"><div id="mission"></div><div id="account-detail" hidden><span id="account-email"></span></div><div id="sign-in-description" hidden></div></div>
    </div>
    <div id="phase" role="status" aria-live="polite"><span id="phase-icon" aria-hidden="true"></span><span id="phase-text"></span></div>
    <div id="issue" role="alert" hidden><span id="issue-text"></span></div>
    <div id="activity-meta" hidden><span id="stage-count"></span><span id="queued-count"></span><span id="running-count"></span><span id="unsaved"></span></div>
    <span id="view-metric" hidden></span>
    <div class="info-footer" hidden>
     <span id="account-location" hidden></span>
     <section id="account-overview" aria-label="Account overview" hidden>
      <div id="account-stats-loading" aria-hidden="true" hidden><i class="skeleton-line"></i><i class="skeleton-line"></i><i class="skeleton-line"></i></div>
      <div id="account-statistics" hidden>
       <span><b id="organization-count"></b> <span id="organizations-label"></span></span>
       <span><b id="workspace-count"></b> <span id="workspaces-label"></span></span>
       <span><b id="project-count"></b> <span id="projects-label"></span></span>
      </div>
     </section>
    </div>
    <div class="info-actions" hidden><button id="account-sign-in" type="button" hidden></button><button id="show-main" type="button" hidden></button></div>
    <div id="account-loading" role="status" hidden><span id="account-loading-label" class="sr-only"></span><i class="skeleton-line"></i><i class="skeleton-line"></i><i class="skeleton-line"></i></div>
   </section>
   <section class="visual">
    <img id="mirror" alt="" draggable="false" hidden>
    <div id="feedback" aria-hidden="true" hidden></div>
    <div id="view-loading" aria-hidden="true" hidden><i class="skeleton-line"></i><i class="skeleton-line"></i><i class="skeleton-line"></i></div>
    <span id="unavailable" hidden></span><span id="stale" hidden></span>
   </section>
  </div>
  <section id="update-panel" aria-labelledby="update-heading" hidden>
   <div class="update-header">
    <h2 id="update-heading"></h2>
    <div id="update-versions"></div>
    <button id="update-dismiss" type="button">×</button>
   </div>
   <div class="update-content">
    <div id="update-title" role="status" aria-live="polite"></div>
    <p id="update-description"></p>
   </div>
   <div class="update-footer">
    <progress id="update-progress" max="100" value="0" hidden></progress>
    <div class="update-actions"><button id="update-later" type="button"></button><button id="update-retry" type="button" hidden></button><button id="update-install" type="button" hidden></button></div>
   </div>
  </section>
 </section>
</div>
</body>
</html>
