<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}} · Plasmic</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202638; background: #f6f7f9; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 600px; padding: 48px 24px; text-align: center; }
    .status { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 28px; border-radius: 50%; background: #eae4ff; color: #8755ed; font-size: 32px; }
    .brand { color: #8d97aa; font-size: 14px; letter-spacing: .2em; }
    h1 { margin: 24px 0 18px; font-size: clamp(28px, 5vw, 40px); letter-spacing: -.04em; }
    p { color: #748097; line-height: 1.7; font-size: 18px; }
    a { display: inline-block; margin: 20px 0; padding: 14px 26px; border-radius: 10px; color: #fff; background: #1677ff; text-decoration: none; font-weight: 600; }
    .hint { font-size: 14px; color: #8d97aa; }
  </style>
</head>
<body>
  <main>
    <div class="status" aria-hidden="true">{{status}}</div>
    <div class="brand">PLASMIC</div>
    <h1>{{title}}</h1>
    <p>{{message}}</p>
    <a href="plasmic-desktop://login-complete">Open Plasmic</a>
    <p class="hint">Allow your browser to open Plasmic. If it doesn't open automatically, use the button above.<br />You can close this tab after returning to the app.</p>
  </main>
  {{autoOpen}}
</body>
</html>
