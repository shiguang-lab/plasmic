<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light;
        --studio-loading-layout: #eceef3;
        --studio-loading-surface: #ffffff;
        --studio-loading-muted: #70778b;
        --studio-loading-border: #e6e8ef;
        --studio-loading-fill: #d8dbe4;
        background-color: var(--studio-loading-layout);
      }
      :root[data-ui-appearance="dark"] {
        color-scheme: dark;
        --studio-loading-layout: #15161b;
        --studio-loading-surface: #202128;
        --studio-loading-muted: #9295a7;
        --studio-loading-border: #30313b;
        --studio-loading-fill: #3b3d48;
      }
      body {
        margin: 0;
        background-color: var(--studio-loading-layout);
      }
    </style>
    <style>
      <%= previewLoadingCss %>
    </style>
    <meta name="robots" content="noindex" />
    <script>
      if (navigator.userAgent.includes("PlasmicDesktop/darwin")) {
        document.documentElement.classList.add("plasmic-desktop-mac");
      } else if (navigator.userAgent.includes("PlasmicDesktop/win32")) {
        document.documentElement.classList.add("plasmic-desktop-windows");
      }
      const maybeParams = !!window.__PlasmicStudioArgs
        ? new URLSearchParams(window.__PlasmicStudioArgs.replace(/^#/, "?"))
        : undefined;
      const origin = maybeParams
        ? maybeParams.get("origin")
        : window.location.origin;
      const staticOrigin = "<%= staticUrl %>";
      // Resolve appearance before the bundle loads, including embedded hosts.
      const startupSystemTheme = window.matchMedia(
        "(prefers-color-scheme: dark)",
      );
      function applyStartupAppearance() {
        const inherited = maybeParams?.get("uiAppearance");
        if (inherited === "dark" || inherited === "light") {
          document.documentElement.dataset.uiAppearance = inherited;
          return;
        }
        let preference = "dark";
        try {
          const stored = localStorage.getItem("shiguang.ui.appearance");
          if (["dark", "light", "system"].includes(stored)) preference = stored;
        } catch (err) {}
        document.documentElement.dataset.uiAppearance =
          preference === "system"
            ? startupSystemTheme.matches
              ? "dark"
              : "light"
            : preference;
      }
      applyStartupAppearance();
      if (window.top === window) {
        void window.desktopEnvironment?.setUiAppearance?.(
          document.documentElement.dataset.uiAppearance,
        );
      }
    </script>
    <script>
      if (typeof window !== "undefined") {
        if (window.parent !== window) {
          try {
            window.__REACT_DEVTOOLS_GLOBAL_HOOK__ =
              window.parent.__REACT_DEVTOOLS_GLOBAL_HOOK__;
          } catch (err) {}
        }
        if (!window.__REACT_DEVTOOLS_GLOBAL_HOOK__) {
          const renderers = new Map();
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
            supportsFiber: true,
            renderers,
            inject: (renderer) => {
              renderers.set(renderers.size + 1, renderer);
            },
            onCommitFiberRoot: function () {},
            onCommitFiberUnmount: function () {},
          };
        }
        if (!window.__REACT_DEVTOOLS_GLOBAL_HOOK__.__PlasmicPreambleVersion) {
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__.__PlasmicPreambleVersion = "1";
        }
      }
    </script>
    <script>
      const isProd =
        "isProd" in window
          ? window.isProd
          : window.origin === "https://studio.plasmic.app";
      window.isProd = isProd;
    </script>

      .fontTester {
        font-family: plasmicTestFont;
        display: block;
        position: absolute;
        left: 0px;
        top: -1000px;
      }

      .studio-loading {
        display: none;
        position: absolute;
        inset: 0;
        grid-area: clipper;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        overflow: hidden;
        padding: 24px;
        z-index: 10;
        align-items: center;
        justify-content: center;
        background: var(--studio-loading-layout);
        color: var(--studio-loading-muted);
        font:
          12px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        pointer-events: none;
      }
      .canvas-editor__canvas-container > .studio-loading,
      #studio-startup-loading {
        position: absolute;
        padding: 96px max(24px, 8vw) 100px;
      }
      .studio-loading.visible {
        display: flex;
      }
      .studio-loading.fadeOut {
        display: none;
      }
      #studio-startup-loading.studio-loading--managed {
        position: fixed;
        z-index: 36;
        background: transparent;
      }
      .studio-loading__pages {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 28px;
        width: min(100%, 1440px);
        max-height: 100%;
        overflow: hidden;
      }
      .studio-loading__page {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .studio-loading__page-label {
        width: 34% !important;
        height: 12px;
      }
      .studio-loading__artboard {
        display: flex;
        flex-direction: column;
        height: clamp(240px, 38vh, 400px);
        overflow: hidden;
        border: 1px solid var(--studio-loading-border);
        border-radius: 8px;
        background: var(--studio-loading-surface);
      }
      .studio-loading__page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 36px;
        padding: 0 12px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--studio-loading-border);
      }
      .studio-loading__logo {
        width: 24% !important;
        height: 10px;
      }
      .studio-loading__action {
        width: 12% !important;
        height: 16px;
      }
      .studio-loading__page-body {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .studio-loading__sidebar {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 16%;
        padding: 18px 10px;
        flex-shrink: 0;
        border-right: 1px solid var(--studio-loading-border);
      }
      .studio-loading__sidebar > * {
        height: 8px;
      }
      .studio-loading__main {
        display: flex;
        flex-direction: column;
        gap: 16px;
        flex: 1;
        min-width: 0;
        padding: 18px 14px;
      }
      .studio-loading__heading {
        width: 60% !important;
        height: 16px;
      }
      .studio-loading__filters,
      .studio-loading__row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .studio-loading__filters > * {
        height: 22px;
      }
      .studio-loading__table {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .studio-loading__row {
        padding: 12px 0;
        border-bottom: 1px solid var(--studio-loading-border);
      }
      .studio-loading__row > * {
        height: 8px;
      }
      .studio-loading__pagination {
        width: 32% !important;
        height: 8px;
        align-self: flex-end;
      }
      .studio-loading .ant-skeleton.ant-skeleton-element .ant-skeleton-input {
        width: 100%;
        min-width: 0;
        height: 100%;
        vertical-align: top;
      }
      .studio-loading__placeholder {
        width: 100%;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          var(--studio-loading-border) 25%,
          var(--studio-loading-fill, var(--studio-loading-muted)) 37%,
          var(--studio-loading-border) 63%
        );
        background-size: 400% 100%;
        animation: studioLoadingShimmer 1.4s ease infinite;
      }
      .studio-loading__label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      @keyframes studioLoadingShimmer {
        from {
          background-position: 100% 50%;
        }
        to {
          background-position: 0 50%;
        }
      }
      @media (max-width: 720px) {
        .studio-loading__pages {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }
        .studio-loading__page:last-child {
          display: none;
        }
        .studio-loading__main {
          padding: 14px 10px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .studio-loading__placeholder,
        .studio-loading .ant-skeleton-active .ant-skeleton-input {
          animation: none !important;
        }
      }
    </style>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
    <div class="app-container"></div>
    <!-- This is used to test if a font is available or not -->
    <div class="fontTester" style="display: none">Plasmic</div>
    <!-- This is used to upload the file for "import project" menu -->
    <input
      class="hidden-file-selector"
      style="display: none"
      type="file"
      accept=".json,.txt"
    />
    <a class="hidden-file-download" href="" style="display: none"
      >hidden link</a
    >
    <div
      id="studio-startup-loading"
      class="studio-loading"
      role="status"
      aria-busy="true"
    >
      <div class="studio-loading__pages" aria-hidden="true">
        <div class="studio-loading__page">
          <div class="studio-loading__page-label">
            <div class="studio-loading__placeholder"></div>
          </div>
          <div class="studio-loading__artboard">
            <div class="studio-loading__page-header">
              <div class="studio-loading__logo">
                <div class="studio-loading__placeholder"></div>
              </div>
