    <script>
      if (navigator.userAgent.includes("PlasmicDesktop/darwin")) {
        document.documentElement.classList.add("plasmic-desktop-mac");
      } else if (navigator.userAgent.includes("PlasmicDesktop/win32")) {
        document.documentElement.classList.add("plasmic-desktop-windows");
      }
      const maybeParams = !!window.__PlasmicStudioArgs
        ? new URLSearchParams(window.__PlasmicStudioArgs.replace(/^#/, "?"))
        : undefined;
      const origin = maybeParams
        ? maybeParams.get("origin")
        : window.location.origin;
      const staticOrigin = "<%= staticUrl %>";
      // Resolve appearance before the bundle loads, including embedded hosts.
      const startupSystemTheme = window.matchMedia(
        "(prefers-color-scheme: dark)",
      );
      function applyStartupAppearance() {
        let preference = "system";
        try {
          const stored = localStorage.getItem("shiguang.ui.appearance");
          if (["dark", "light", "system"].includes(stored)) preference = stored;
        } catch (err) {}
        document.documentElement.dataset.uiAppearance =
          preference === "system"
            ? startupSystemTheme.matches
              ? "dark"
              : "light"
            : preference;
      }
      applyStartupAppearance();
    </script>
    <script>
      if (typeof window !== "undefined") {
        if (window.parent !== window) {
          try {
            window.__REACT_DEVTOOLS_GLOBAL_HOOK__ =
              window.parent.__REACT_DEVTOOLS_GLOBAL_HOOK__;
          } catch (err) {}
        }
        if (!window.__REACT_DEVTOOLS_GLOBAL_HOOK__) {
          const renderers = new Map();
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
            supportsFiber: true,
            renderers,
            inject: (renderer) => {
              renderers.set(renderers.size + 1, renderer);
            },
            onCommitFiberRoot: function () {},
            onCommitFiberUnmount: function () {},
          };
        }
        if (!window.__REACT_DEVTOOLS_GLOBAL_HOOK__.__PlasmicPreambleVersion) {
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__.__PlasmicPreambleVersion = "1";
        }
      }
    </script>
    <script>
      const isProd =

          : window.origin === "https://studio.plasmic.app";
      window.isProd = isProd;

      .fontTester {
        font-family: plasmicTestFont;
        display: block;
        position: absolute;
        left: 0px;
        top: -1000px;
      }

      :root {
        --studio-loading-layout: #eceef3;
        --studio-loading-surface: #ffffff;
        --studio-loading-muted: #70778b;
        --studio-loading-border: #e6e8ef;
        --studio-loading-fill: #d7dbe5;
      }
      :root[data-ui-appearance="dark"] {
        --studio-loading-layout: #15161b;
        --studio-loading-surface: #202128;
        --studio-loading-muted: #9295a7;
        --studio-loading-border: #30313b;
        --studio-loading-fill: #373842;
      }
      .StudioPlaceholder {
        display: none;
        position: fixed;
        inset: 0;
        background: var(--studio-loading-layout);
        color: var(--studio-loading-muted);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        transition:
          opacity 250ms,
          visibility 250ms;
        pointer-events: none;
      }
      .StudioPlaceholder.fadeOut {
        opacity: 0;
        visibility: hidden;
      }
      .StudioPlaceholder.visible {
        display: block;
      }
      .placeholder_topBar {
        position: absolute;
        z-index: 2;
        top: 16px;
        left: 16px;
        right: 16px;
        height: 48px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .placeholder_projectCapsule,
      .placeholder_actions,
      .placeholder_leftToolbar,
      .placeholder_rightPanel,
      .placeholder_canvasControls {
        box-sizing: border-box;
        background: var(--studio-loading-surface);
        border: 1px solid var(--studio-loading-border);
        border-radius: 12px;
        box-shadow: 0 8px 24px #00000018;
      }
      .placeholder_projectCapsule,
      .placeholder_actions {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        min-width: 0;
        overflow: hidden;
      }
      .placeholder_actions {
        flex: none;
      }
      .plasmic-desktop-mac .placeholder_projectCapsule {
        padding-left: 80px;
        border-radius: 24px;
      }
      .plasmic-desktop-windows .placeholder_topBar {
        right: 160px;
      }
      .placeholder_icon {
        width: 29px;
        height: 29px;
        flex: none;
        color: #7955d9;
      }
      :root[data-ui-appearance="dark"] .placeholder_icon {
        color: #9474ff;
      }
      .placeholder_skeleton {
        display: block;
        height: 10px;
        width: 100%;
        border-radius: 4px;
        background: var(--studio-loading-fill);
        animation: placeholderPulse 2s ease-in-out infinite;
      }
      .placeholder_line--short {
        width: 56px;
      }
      .placeholder_line--medium {
        width: 96px;
      }
      .placeholder_line--long {
        width: 144px;
      }
      .placeholder_button {
        width: 64px;
        height: 32px;
        border-radius: 7px;
      }
      .placeholder_square {
        width: 20px;
        height: 20px;
        flex: none;
      }
      .placeholder_leftToolbar {
        position: absolute;
        z-index: 1;
        top: 82px;
        left: 16px;
        width: 56px;
        max-height: calc(100% - 170px);
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 26px;
        padding: 18px 5px;
        overflow: hidden;
      }
      .placeholder_toolbarBottom {
        margin-top: 14px;
      }
      .placeholder_panelHeader {
        height: 48px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--studio-loading-border);
      }
      .placeholder_canvasArea {
        position: absolute;
        inset: 0;
        padding: 154px 356px 110px 92px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: radial-gradient(
          var(--studio-loading-border) 0.75px,
          transparent 1px
        );
        background-size: 20px 20px;
      }
      .placeholder_artboard {
        width: 100%;
        max-width: 720px;
        height: min(100%, 520px);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .placeholder_artboardSurface {
        flex: 1;
        min-height: 0;
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: var(--studio-loading-surface);
        border: 1px solid var(--studio-loading-border);
        border-radius: 2px;
      }
      .placeholder_artboardContent {
        flex: 1;
        min-height: 0;
        background: var(--studio-loading-layout);
        border-radius: 6px;
      }
      .placeholder_artboardSurface .placeholder_skeleton {
        max-width: 100%;
      }
      .placeholder_canvasControls {
        position: absolute;
        right: 16px;
        bottom: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 50px;
        padding: 6px 12px;
      }
      .placeholder_rightPanel {
        position: absolute;
        z-index: 1;
        top: 82px;
        right: 16px;
        bottom: 88px;
        width: 320px;
        overflow: hidden;
      }
      .placeholder_propertyGroup {
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        border-bottom: 1px solid var(--studio-loading-border);
      }
      .placeholder_fieldRow {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px;
        align-items: center;
      }
      .placeholder_field {
        height: 28px;
        border: 1px solid var(--studio-loading-fill);
        background: var(--studio-loading-layout);
        box-sizing: border-box;
        border-radius: 5px;
      }
      .placeholder_loadingStatus {
        position: absolute;
        z-index: 2;
        top: 94px;
        left: calc(50% - 132px);
        transform: translateX(-50%);
        padding: 8px 16px;
        background: var(--studio-loading-surface);
        border: 1px solid var(--studio-loading-border);
        border-radius: 20px;
        font-size: 12px;
      }
      @keyframes placeholderPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .StudioPlaceholder {
          transition: none;
        }
        .placeholder_skeleton {
          animation: none;
        }
      }
      @media (max-width: 640px) {
        .placeholder_rightPanel {
          display: none;
        }
        .placeholder_canvasArea {
          padding-right: 20px;
        }
        .placeholder_loadingStatus {
          left: 50%;
        }
        .placeholder_projectCapsule > .placeholder_line--short {
          display: none;
        }
        .placeholder_projectCapsule > .placeholder_line--long {
          width: 80px;
        }
        .placeholder_actions {
          gap: 8px;
          padding: 0 8px;
        }
        .placeholder_button {
          width: 32px;
        }
      }
    </style>

    <script>
      document.getElementById("shortcutIcon").href = `${origin}/favicon.svg`;
      document.getElementById("normalizeCss").href =
        `${staticOrigin}/static/css/normalize.css`;
    </script>
