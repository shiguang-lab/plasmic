    <script>
      if (navigator.userAgent.includes("PlasmicDesktop/darwin")) {
        document.documentElement.classList.add("plasmic-desktop-mac");
      }
      const maybeParams = !!window.__PlasmicStudioArgs
        ? new URLSearchParams(window.__PlasmicStudioArgs.replace(/^#/, "?"))
        : undefined;
      const origin = maybeParams
        ? maybeParams.get("origin")
        : window.location.origin;
      const staticOrigin = "<%= staticUrl %>";
      // Resolve appearance before the bundle loads, including embedded hosts.
      const startupSystemTheme = window.matchMedia("(prefers-color-scheme: dark)");
      function applyStartupAppearance() {
        let preference = "system";
        try {
          const stored = localStorage.getItem("shiguang.ui.appearance");
          if (["dark", "light", "system"].includes(stored)) preference = stored;
        } catch (err) {}
        document.documentElement.dataset.uiAppearance =
          preference === "system" ? (startupSystemTheme.matches ? "dark" : "light") : preference;
      }
      applyStartupAppearance();

    </script>
    <script>
      if (typeof window !== "undefined") {
        if (window.parent !== window) {
          try {
            window.__REACT_DEVTOOLS_GLOBAL_HOOK__ =
              window.parent.__REACT_DEVTOOLS_GLOBAL_HOOK__;
          } catch (err) {}
        }
        if (!window.__REACT_DEVTOOLS_GLOBAL_HOOK__) {
          const renderers = new Map();
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
            supportsFiber: true,
            renderers,
            inject: (renderer) => {
              renderers.set(renderers.size + 1, renderer);
            },
            onCommitFiberRoot: function () {},
            onCommitFiberUnmount: function () {},
          };
        }
        if (!window.__REACT_DEVTOOLS_GLOBAL_HOOK__.__PlasmicPreambleVersion) {
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__.__PlasmicPreambleVersion = "1";
        }
      }
    </script>
    <script>
      const isProd =
        "isProd" in window

          : window.origin === "https://studio.plasmic.app";
      window.isProd = isProd;

      .fontTester {
        font-family: plasmicTestFont;
        display: block;
        position: absolute;
        left: 0px;
        top: -1000px;
      }

      :root {
        --studio-loading-layout: #eceef3;
        --studio-loading-surface: #ffffff;
        --studio-loading-muted: #70778b;
        --studio-loading-border: #e6e8ef;
        --studio-loading-fill: #d7dbe5;
      }
      :root[data-ui-appearance="dark"] {
        --studio-loading-layout: #15161b;
        --studio-loading-surface: #202128;
        --studio-loading-muted: #9295a7;
        --studio-loading-border: #30313b;
        --studio-loading-fill: #373842;
      }
      .StudioPlaceholder {
        display: none;
        position: fixed;
        inset: 0;
        grid-template:
          "topBar topBar topBar topBar" 56px
          "leftToolbar leftPanel canvasArea rightPanel" minmax(0, 1fr)
          / 68px 302px minmax(0, 1fr) 344px;
        background: var(--studio-loading-layout);
        color: var(--studio-loading-muted);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        transition:
          opacity 250ms,
          visibility 250ms;
        pointer-events: none;
      }
      .StudioPlaceholder.fadeOut {
        opacity: 0;
        visibility: hidden;
      }
      .StudioPlaceholder.visible {
        display: grid;
      }
      .StudioPlaceholder > * {
        background: var(--studio-loading-surface);
        min-width: 0;
        overflow: hidden;
      }
      .placeholder_topBar {
        grid-area: topBar;
        padding: 0 12px 0 10px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .plasmic-desktop-mac .placeholder_topBar {
        padding-left: 106px;
      }
      .placeholder_icon {
        width: 24px;
        height: 24px;
        flex: none;
        color: var(--studio-loading-muted);
      }
      .placeholder_actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
      }
      .placeholder_skeleton {
        display: block;
        height: 10px;
        width: 100%;
        border-radius: 4px;
        background: var(--studio-loading-fill);
        animation: placeholderPulse 2s ease-in-out infinite;
      }
      .placeholder_line--short {
        width: 56px;
      }
      .placeholder_line--medium {
        width: 96px;
      }
      .placeholder_line--long {
        width: 144px;
      }
      .placeholder_button {
        width: 64px;
        height: 28px;
        border-radius: 6px;
      }
      .placeholder_square {
        width: 20px;
        height: 20px;
        flex: none;
      }
      .placeholder_leftToolbar {
        grid-area: leftToolbar;
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 24px;
        padding: 20px 0 16px;
      }
      .placeholder_toolbarBottom {
        margin-top: auto;
      }
      .placeholder_leftPanel {
        grid-area: leftPanel;
      }
      .placeholder_panelHeader {
        height: 48px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--studio-loading-border);
      }
      .placeholder_search {
        height: 30px;
        margin: 16px;
        width: calc(100% - 32px);
        background: var(--studio-loading-layout);
        border: 1px solid var(--studio-loading-fill);
        box-sizing: border-box;
        border-radius: 6px;
      }
      .placeholder_tree {
        padding: 8px 16px;
      }
      .placeholder_treeRow {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
      }
      .placeholder_treeRow--nested {
        padding-left: 24px;
      }
      .placeholder_treeRow--deep {
        padding-left: 48px;
      }
      .placeholder_treeRow .placeholder_square {
        width: 14px;
        height: 14px;
      }
      .placeholder_canvasArea {
        grid-area: 2 / 1 / 3 / -1;
        padding-left: 390px;
        padding-right: 364px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 72px;
        padding-bottom: 90px;
        background: transparent;
        overflow: visible;
      }
      .placeholder_artboard {
        width: 100%;
        max-width: 720px;
        height: min(100%, 520px);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .placeholder_artboardSurface {
        flex: 1;
        min-height: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: var(--studio-loading-surface);
        border: 1px solid var(--studio-loading-border);
        border-radius: 2px;
        box-shadow: 0 2px 8px #00000003;
      }
      .placeholder_artboardContent {
        flex: 1;
        min-height: 0;
        background: var(--studio-loading-layout);
        border-radius: 6px;
      }
      .placeholder_artboardSurface .placeholder_skeleton {
        max-width: 100%;
      }
      .placeholder_canvasControls {
        position: absolute;
        right: 20px;
        bottom: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 12px;
        background: var(--studio-loading-surface);
        border: 1px solid var(--studio-loading-border);
      }
      .placeholder_rightPanel {
        grid-area: rightPanel;
      }
      .placeholder_propertyGroup {
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        border-bottom: 1px solid var(--studio-loading-border);
      }
      .placeholder_fieldRow {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px;
        align-items: center;
      }
      .placeholder_field {
        height: 28px;
        border: 1px solid var(--studio-loading-fill);
        background: var(--studio-loading-layout);
        box-sizing: border-box;
        border-radius: 5px;
      }
      .placeholder_loadingStatus {
        position: absolute;
        z-index: 2;
        top: 76px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border: 1px solid var(--studio-loading-border);
        border-radius: 20px;
        font-size: 12px;
      }
      @keyframes placeholderPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .StudioPlaceholder {
          transition: none;
        }
        .placeholder_skeleton {
          animation: none;
        }
      }
      .placeholder_topBar { border-bottom: 1px solid var(--studio-loading-border); }
      .placeholder_leftToolbar,
      .placeholder_leftPanel,
      .placeholder_rightPanel {
        z-index: 1;
        margin: 12px 0 72px 12px;
        border: 1px solid var(--studio-loading-border);
        border-radius: 12px;
        box-shadow: 0 8px 24px #00000018;
      }
      .placeholder_rightPanel { margin-right: 12px; }
      .placeholder_canvasArea {
        background-image: radial-gradient(var(--studio-loading-border) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      @media (max-width: 1100px) {
        .StudioPlaceholder { grid-template-columns: 68px 0 minmax(0, 1fr) 344px; }
        .placeholder_leftPanel { display: none; }
        .placeholder_canvasArea { padding-left: 88px; }
      }
      @media (max-width: 640px) {
        .StudioPlaceholder { grid-template-columns: 68px 0 minmax(0, 1fr) 0; }
        .placeholder_rightPanel { display: none; }
        .placeholder_canvasArea { padding-right: 20px; }
        .placeholder_topBar > .placeholder_line--short { display: none; }
      }
    </style>
