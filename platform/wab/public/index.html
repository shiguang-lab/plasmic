<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light;
        --studio-loading-layout: #eceef3;
        --studio-loading-muted: #70778b;
        --studio-loading-border: #e6e8ef;
        background-color: var(--studio-loading-layout);
      }
      :root[data-ui-appearance="dark"] {
        color-scheme: dark;
        --studio-loading-layout: #15161b;
        --studio-loading-muted: #9295a7;
        --studio-loading-border: #30313b;
      }
      body {
        margin: 0;
        background-color: var(--studio-loading-layout);
      }
    </style>
    <style>
      <%= previewLoadingCss %>
    </style>
    <meta name="robots" content="noindex" />
    <script>
      if (navigator.userAgent.includes("PlasmicDesktop/darwin")) {
        document.documentElement.classList.add("plasmic-desktop-mac");
      } else if (navigator.userAgent.includes("PlasmicDesktop/win32")) {
        document.documentElement.classList.add("plasmic-desktop-windows");
      }
      const maybeParams = !!window.__PlasmicStudioArgs
        ? new URLSearchParams(window.__PlasmicStudioArgs.replace(/^#/, "?"))
        : undefined;
      const origin = maybeParams
        ? maybeParams.get("origin")
        : window.location.origin;
      const staticOrigin = "<%= staticUrl %>";
      // Resolve appearance before the bundle loads, including embedded hosts.
      const startupSystemTheme = window.matchMedia(
        "(prefers-color-scheme: dark)",
      );
      function applyStartupAppearance() {
        const inherited = maybeParams?.get("uiAppearance");
        if (inherited === "dark" || inherited === "light") {
          document.documentElement.dataset.uiAppearance = inherited;
          return;
        }
        let preference = "dark";
        try {
          const stored = localStorage.getItem("shiguang.ui.appearance");
          if (["dark", "light", "system"].includes(stored)) preference = stored;
        } catch (err) {}
        document.documentElement.dataset.uiAppearance =
          preference === "system"
            ? startupSystemTheme.matches
              ? "dark"
              : "light"
            : preference;
      }
      applyStartupAppearance();
      if (window.top === window) {
        void window.desktopEnvironment?.setUiAppearance?.(
          document.documentElement.dataset.uiAppearance,
        );
      }
    </script>
    <script>
      if (typeof window !== "undefined") {
        if (window.parent !== window) {
          try {
            window.__REACT_DEVTOOLS_GLOBAL_HOOK__ =
              window.parent.__REACT_DEVTOOLS_GLOBAL_HOOK__;
          } catch (err) {}
        }
        if (!window.__REACT_DEVTOOLS_GLOBAL_HOOK__) {
          const renderers = new Map();
          let lastRendererId = 0;
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
            supportsFiber: true,
            renderers,
            inject: (renderer) => {
              renderers.set(++lastRendererId, renderer);
              return lastRendererId;
            },
            onCommitFiberRoot: function () {},
            onCommitFiberUnmount: function () {},
          };
        }
        if (!window.__REACT_DEVTOOLS_GLOBAL_HOOK__.__PlasmicPreambleVersion) {
          window.__REACT_DEVTOOLS_GLOBAL_HOOK__.__PlasmicPreambleVersion = "1";
        }
      }
    </script>
    <script>
      const isProd =
        "isProd" in window
          ? window.isProd
          : window.origin === "https://studio.plasmic.app";
      window.isProd = isProd;
    </script>

      .fontTester {
        font-family: plasmicTestFont;
        display: block;
        position: absolute;
        left: 0px;
        top: -1000px;
      }

      .studio-loading {
        display: none;
        position: absolute;
        inset: 0;
        grid-area: clipper;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        overflow: hidden;
        padding: 24px;
        z-index: 10;
        align-items: center;
        justify-content: center;
        background: var(--studio-loading-layout);
        color: var(--studio-loading-muted);
        font:
          12px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        pointer-events: none;
      }
      .canvas-editor__canvas-container > .studio-loading,
      #studio-startup-loading {
        position: absolute;
        padding: 96px max(24px, 8vw) 100px;
      }
      .studio-loading.visible {
        display: flex;
      }
      .studio-loading.fadeOut {
        display: none;
      }
      #studio-startup-loading.studio-loading--managed {
        position: fixed;
        z-index: 36;
        background: transparent;
      }
      .startup-loading__art {
        position: relative;
        display: block;
        width: 192px;
        max-width: 100%;
      }
      .startup-loading__logo {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .startup-loading__construction,
      .startup-loading__sheen-clip {
        position: absolute;
        left: 24%;
        top: calc(61 / 330 * 100%);
        width: 52%;
        height: calc(208 / 330 * 100%);
        mask-size: 100% 100%;
        mask-repeat: no-repeat;
        -webkit-mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
        overflow: hidden;
        pointer-events: none;
      }
      .startup-loading__construction {
        opacity: 0;
        pointer-events: none;
      }
      .startup-loading__sheen {
        width: 50%;
        height: 100%;
        opacity: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.7),
          transparent
        );
      }
      .startup-loading__wire {
        fill: none;
        stroke: var(--studio-loading-muted, #70778b);
        stroke-width: 0.1;
      }
    </style>

      document.getElementById("normalizeCss").href =
        `${staticOrigin}/static/css/normalize.css`;

      see: "Using with webpack" https://github.com/superRaytin/react-monaco-editor

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
    <div class="app-container"></div>
    <!-- This is used to test if a font is available or not -->
    <div class="fontTester" style="display: none">Plasmic</div>
    <!-- This is used to upload the file for "import project" menu -->
    <input
      class="hidden-file-selector"
      style="display: none"
      type="file"
      accept=".plasmic,.json,.txt"
    />
    <a class="hidden-file-download" href="" style="display: none"
      >hidden link</a
    >
    <% for (const mode of ["studio", "preview"]) { %>
    <div
      id="<%= mode %>-startup-loading"
      class="<%= mode %>-loading"
      role="status"
      aria-label="Loading…"
      aria-busy="true"
    >
      <% const id = mode + "-startup"; %>
      <div class="startup-loading__art">
        <svg
          class="startup-loading__logo"
          viewBox="0 0 400 330"
          aria-hidden="true"
        >
          <defs>
            <linearGradient
              id="<%= id %>-fill"
              gradientUnits="userSpaceOnUse"
              x1="<%= brand.gradient.x1 %>"
              y1="<%= brand.gradient.y1 %>"
              x2="<%= brand.gradient.x2 %>"
              y2="<%= brand.gradient.y2 %>"
            >
              <% for (const stop of brand.gradient.stops) { %>
              <stop
                offset="<%= stop.offset %>"
                stop-color="<%= stop.color %>"
              />
              <% } %>
            </linearGradient>
            <% brand.paths.forEach((path, i) => { %>
            <path id="<%= id %>-<%= i %>" data-track d="<%= path %>" />
            <% }); %>
            <clipPath id="<%= id %>-clip">
              <% brand.paths.forEach((_, i) => { %>
              <use href="#<%= id %>-<%= i %>" />
              <% }); %>
            </clipPath>
          </defs>
          <g transform="translate(96 61) scale(6.5)">
            <g data-scaffold opacity=".55" class="startup-loading__wire">
              <g clip-path="url(#<%= id %>-clip)">
                <% for (let i = 0; i < 44; i++) { const y = (19 + i * 4.4) /
                6.5; %>
                <path
                  d="M-.77 <%= y %> Q16.15 <%= y - 3.23 %> 32.3 <%= y - 0.46 %>"
                />
                <% } %>
              </g>
              <g opacity=".3">
                <% brand.paths.forEach((_, i) => { %>
                <use href="#<%= id %>-<%= i %>" />
                <% }); %>
              </g>
            </g>
            <g data-solid fill="url(#<%= id %>-fill)" opacity="1">
              <% brand.paths.forEach((_, i) => { %>
              <use href="#<%= id %>-<%= i %>" />
              <% }); %>
            </g>
          </g>
        </svg>
        <img
          data-construction
          data-src="<%= staticUrl %>/static/img/<%= construction.file %>"
          data-duration="<%= construction.duration %>"
          class="startup-loading__construction"
          width="200"
          height="200"
          alt=""
          aria-hidden="true"
          decoding="async"
        />
        <% const logoMask = encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' + brand.paths.map(path => '<path fill="white" d="' + path + '"/>').join('') + '</svg>'); %>
        <div
          class="startup-loading__sheen-clip"
          style="
            mask-image: url(&quot;data:image/svg+xml,<%= logoMask %>&quot;);
            -webkit-mask-image: url(&quot;data:image/svg+xml,<%= logoMask %>&quot;);
          "
          aria-hidden="true"
        >
          <div data-sheen class="startup-loading__sheen"></div>
        </div>
      </div>
    </div>
    <% } %>
    <script>
      if (
        /^(?:\/projects\/[^/]+\/preview\/?|\/d\/[\w-]{10})$/.test(
          window.location.pathname,
        )
      ) {
        document
          .getElementById("preview-startup-loading")
          .classList.add("visible");
      } else if (/^\/projects\/[a-z0-9]+/.test(window.location.pathname)) {
        document
          .getElementById("studio-startup-loading")
          .classList.add("visible");
      }
    </script>
    <script>
      const animateStartupLogo = (<%= brandLoadingAnimation %>);
      for (const mode of ["studio", "preview"]) {
        const loading = document.getElementById(`${mode}-startup-loading`);
        let stop;
        const update = () => {
          const visible = loading.classList.contains("visible") && !loading.classList.contains("fadeOut");
          if (visible && !stop) {
            stop = animateStartupLogo(loading.querySelector("svg"));
          } else if (!visible && stop) {
            stop();
            stop = undefined;
          }
        };
        new MutationObserver(update).observe(loading, { attributes: true, attributeFilter: ["class"] });
        update();
      }
    </script>
