# Own pnpm root, so `pnpm install` here does not walk up to
# platform/pnpm-workspace.yaml and install the wab workspace instead.
packages: []

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@plasmicapp/*"
  - "@plasmicpkgs/*"
patchedDependencies:
  '@rc-component/util@1.13.0': patches/@rc-component__util@1.13.0.patch
