minimumReleaseAge: 0

# Own pnpm root, so `pnpm install` here does not walk up to
# platform/pnpm-workspace.yaml and install the wab workspace instead.
packages: []

patchedDependencies:
  '@rc-component/util@1.14.1': patches/@rc-component__util@1.14.1.patch

# Match the controlled Studio SDK and React runtime.
overrides:
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@plasmicapp/host": link:../../packages/host
