        source !== parentWindow ||

      }

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              data?.type === &quot;widget-state-result&quot;

        return;

&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;plasmic-home-design&#x27;);
const projects=[{id:0,name:&#x27;REQ075 客群管理 · 需求对齐重生成&#x27;,cover:&#x27;客群管理&#x27;,code:&#x27;REQ075&#x27;,date:&#x27;10月10日&#x27;,workspace:&#x27;Prototypes&#x27;},{id:1,name:&#x27;Admin Templates&#x27;,cover:&#x27;Admin&lt;br&gt;Templates&#x27;,code:&#x27;PLASMIC PROJECT&#x27;,date:&#x27;10月9日&#x27;,workspace:&#x27;Prototypes&#x27;}];
const roles=[&#x27;查看者&#x27;,&#x27;评论者&#x27;,&#x27;内容编辑者&#x27;,&#x27;设计者&#x27;,&#x27;开发者&#x27;];
const escape=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
const icon=n=&gt;`&lt;i data-lucide=&quot;${n}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
const button=(text,action,style=&#x27;&#x27;,ico=&#x27;&#x27;)=&gt;`&lt;button type=&quot;button&quot; class=&quot;ph-button cursor-interaction ${style}&quot; data-action=&quot;${action}&quot;&gt;${ico?icon(ico):&#x27;&#x27;}${text}&lt;/button&gt;`;
const nav=(text,page,ico,selected,extra=&#x27;&#x27;)=&gt;`&lt;button type=&quot;button&quot; class=&quot;ph-nav cursor-interaction ${selected?&#x27;active&#x27;:&#x27;&#x27;} ${extra}&quot; data-page=&quot;${page}&quot;&gt;${icon(ico)}&lt;span&gt;${text}&lt;/span&gt;&lt;/button&gt;`;
const instances=[];
root.querySelectorAll(&#x27;.ph-app&#x27;).forEach(app=&gt;{
 const compact=app.dataset.layout===&#x27;compact&#x27;;
 const saved=window.openai?.widgetState?.privateContent?.[app.dataset.layout];
 const state={page:&#x27;projects&#x27;,tab:&#x27;projects&#x27;,view:&#x27;grid&#x27;,query:&#x27;&#x27;,scope:&#x27;all&#x27;,sort:&#x27;updated&#x27;,menu:null,modal:null,project:0,start:&#x27;blank&#x27;,navigator:false,details:!compact,integrations:false,...(saved?.version===3?saved:{})};
 const remember=()=&gt;{if(window.openai?.setWidgetState){const content={};instances.forEach(x=&gt;{content[x.app.dataset.layout]={version:3,page:x.state.page,tab:x.state.tab,view:x.state.view,project:x.state.project,details:x.state.details}});window.openai.setWidgetState({modelContent:{dashboardLayout:app.dataset.layout,page:state.page,projectDetails:state.details},privateContent:content}).catch(()=&gt;{});}};
 const filtered=()=&gt;projects.filter(p=&gt;state.page!==&#x27;personal&#x27;&amp;&amp;state.scope!==&#x27;personal&#x27;&amp;&amp;p.name.toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=&gt;state.sort===&#x27;name&#x27;?a.name.localeCompare(b.name):a.id-b.id);
 const projectMenu=()=&gt;`&lt;div class=&quot;ph-menu ph-project-menu&quot; role=&quot;menu&quot; aria-label=&quot;项目操作&quot;&gt;${[[&#x27;重命名&#x27;,&#x27;rename&#x27;,&#x27;pencil&#x27;],[&#x27;配置项目&#x27;,&#x27;config&#x27;,&#x27;settings-2&#x27;],[&#x27;复制项目&#x27;,&#x27;duplicate&#x27;,&#x27;copy&#x27;],[&#x27;移至工作区&#x27;,&#x27;move&#x27;,&#x27;folder-input&#x27;],[&#x27;设为工作区模板&#x27;,&#x27;starter&#x27;,&#x27;layout-template&#x27;]].map(([t,a,i])=&gt;button(t,a,&#x27;&#x27;,i)).join(&#x27;&#x27;)}&lt;hr&gt;${button(&#x27;删除项目&#x27;,&#x27;delete&#x27;,&#x27;ph-danger&#x27;,&#x27;trash-2&#x27;)}&lt;/div&gt;`;
 const projectCards=()=&gt;filtered().map(p=&gt;`&lt;article class=&quot;ph-project ${state.details&amp;&amp;state.project===p.id?&#x27;is-selected&#x27;:&#x27;&#x27;}&quot; data-project=&quot;${p.id}&quot;&gt;&lt;button class=&quot;ph-cover-button cursor-interaction&quot; type=&quot;button&quot; data-action=&quot;inspect&quot; data-id=&quot;${p.id}&quot; aria-label=&quot;查看 ${escape(p.name)}的详情&quot; aria-pressed=&quot;${state.details&amp;&amp;state.project===p.id}&quot;&gt;&lt;div class=&quot;ph-cover&quot;&gt;&lt;span class=&quot;ph-cover-code&quot;&gt;${icon(&#x27;file&#x27;)} ${p.code}&lt;/span&gt;&lt;strong class=&quot;ph-cover-title&quot;&gt;${p.cover}&lt;/strong&gt;&lt;span class=&quot;ph-cover-footer&quot;&gt;${p.date}修改&lt;/span&gt;&lt;span class=&quot;ph-select-mark&quot;&gt;${icon(&#x27;arrow-up-right&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;/button&gt;&lt;div class=&quot;ph-project-meta&quot;&gt;&lt;div&gt;&lt;button type=&quot;button&quot; class=&quot;ph-title-button cursor-interaction&quot; data-action=&quot;open&quot; data-id=&quot;${p.id}&quot;&gt;${escape(p.name)}&lt;/button&gt;&lt;p&gt;Prototypes&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ph-button quiet cursor-interaction&quot; data-action=&quot;project-menu&quot; data-id=&quot;${p.id}&quot; aria-label=&quot;${escape(p.name)}的操作&quot;&gt;${icon(&#x27;ellipsis&#x27;)}&lt;/button&gt;&lt;/div&gt;${state.menu===&#x27;project&#x27;&amp;&amp;state.project===p.id?projectMenu():&#x27;&#x27;}&lt;/article&gt;`).join(&#x27;&#x27;);
 const projectList=()=&gt;`&lt;table class=&quot;ph-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;项目名称&lt;/th&gt;&lt;th class=&quot;ph-workspace-cell&quot;&gt;工作区&lt;/th&gt;&lt;th class=&quot;ph-date-cell&quot;&gt;修改时间&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${filtered().map(p=&gt;`&lt;tr&gt;&lt;td&gt;&lt;button class=&quot;ph-title-button cursor-interaction&quot; type=&quot;button&quot; data-action=&quot;inspect&quot; data-id=&quot;${p.id}&quot; aria-label=&quot;查看 ${escape(p.name)}的详情&quot;&gt;${escape(p.name)}&lt;/button&gt;&lt;/td&gt;&lt;td class=&quot;ph-small ph-muted ph-workspace-cell&quot;&gt;Prototypes&lt;/td&gt;&lt;td class=&quot;ph-small ph-muted ph-date-cell&quot;&gt;${p.date}&lt;/td&gt;&lt;td style=&quot;position:relative&quot;&gt;&lt;button class=&quot;ph-button quiet cursor-interaction&quot; type=&quot;button&quot; data-action=&quot;project-menu&quot; data-id=&quot;${p.id}&quot; aria-label=&quot;${escape(p.name)}的操作&quot;&gt;${icon(&#x27;ellipsis&#x27;)}&lt;/button&gt;${state.menu===&#x27;project&#x27;&amp;&amp;state.project===p.id?projectMenu():&#x27;&#x27;}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;`;
 const empty=(title,text,act=&#x27;new&#x27;,label=&#x27;新建项目&#x27;,ico=&#x27;file-plus-2&#x27;)=&gt;`&lt;div class=&quot;ph-empty&quot;&gt;&lt;span class=&quot;ph-start-icon&quot;&gt;${icon(ico)}&lt;/span&gt;&lt;h2&gt;${title}&lt;/h2&gt;&lt;p class=&quot;ph-muted&quot;&gt;${text}&lt;/p&gt;${button(label,act,&#x27;primary&#x27;)}&lt;/div&gt;`;
