<!doctype html><html data-ui-appearance="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0}      :root {
        --studio-loading-layout: #eceef3;
        --studio-loading-surface: #ffffff;
        --studio-loading-muted: #70778b;
        --studio-loading-border: #e6e8ef;
        --studio-loading-fill: #d7dbe5;
      }
      :root[data-ui-appearance="dark"] {
        --studio-loading-layout: #15161b;
        --studio-loading-surface: #202128;
        --studio-loading-muted: #9295a7;
        --studio-loading-border: #30313b;
        --studio-loading-fill: #373842;
      }
      .StudioPlaceholder {
        display: none;
        position: fixed;
        inset: 0;
        grid-template:
          "topBar topBar topBar topBar" 56px
          "leftToolbar leftPanel canvasArea rightPanel" minmax(0, 1fr)
          / 68px 302px minmax(0, 1fr) 344px;
        background: var(--studio-loading-layout);
        color: var(--studio-loading-muted);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        transition:
          opacity 250ms,
          visibility 250ms;
        pointer-events: none;
      }
      .StudioPlaceholder.fadeOut {
        opacity: 0;
        visibility: hidden;
      }
      .StudioPlaceholder.visible {
        display: grid;
      }
      .StudioPlaceholder > * {
        background: var(--studio-loading-surface);
        min-width: 0;
        overflow: hidden;
      }
      .placeholder_topBar {
        grid-area: topBar;
        padding: 0 12px 0 10px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .plasmic-desktop-mac .placeholder_topBar {
        padding-left: 106px;
      }
      .placeholder_icon {
        width: 24px;
        height: 24px;
        flex: none;
        color: var(--studio-loading-muted);
      }
      .placeholder_actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
      }
      .placeholder_skeleton {
        display: block;
        height: 10px;
        width: 100%;
        border-radius: 4px;
        background: var(--studio-loading-fill);
        animation: placeholderPulse 2s ease-in-out infinite;
      }
      .placeholder_line--short {
        width: 56px;
      }
      .placeholder_line--medium {
        width: 96px;
      }
      .placeholder_line--long {
        width: 144px;
      }
      .placeholder_button {
        width: 64px;
        height: 28px;
        border-radius: 6px;
      }
      .placeholder_square {
        width: 20px;
        height: 20px;
        flex: none;
      }
      .placeholder_leftToolbar {
        grid-area: leftToolbar;
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 24px;
        padding: 20px 0 16px;
      }
      .placeholder_toolbarBottom {
        margin-top: auto;
      }
      .placeholder_leftPanel {
        grid-area: leftPanel;
      }
      .placeholder_panelHeader {
        height: 48px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--studio-loading-border);
      }
      .placeholder_search {
        height: 30px;
        margin: 16px;
        width: calc(100% - 32px);
        background: var(--studio-loading-layout);
        border: 1px solid var(--studio-loading-fill);
        box-sizing: border-box;
        border-radius: 6px;
      }
      .placeholder_tree {
        padding: 8px 16px;
      }
      .placeholder_treeRow {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
      }
      .placeholder_treeRow--nested {
        padding-left: 24px;
      }
      .placeholder_treeRow--deep {
        padding-left: 48px;
      }
      .placeholder_treeRow .placeholder_square {
        width: 14px;
        height: 14px;
      }
      .placeholder_canvasArea {
        grid-area: 2 / 1 / 3 / -1;
        padding-left: 390px;
        padding-right: 364px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 72px;
        padding-bottom: 90px;
        background: transparent;
        overflow: visible;
      }
      .placeholder_artboard {
        width: 100%;
        max-width: 720px;
        height: min(100%, 520px);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .placeholder_artboardSurface {
        flex: 1;
        min-height: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: var(--studio-loading-surface);
        border: 1px solid var(--studio-loading-border);
        border-radius: 2px;
        box-shadow: 0 2px 8px #00000003;
      }
      .placeholder_artboardContent {
        flex: 1;
        min-height: 0;
        background: var(--studio-loading-layout);
        border-radius: 6px;
      }
      .placeholder_artboardSurface .placeholder_skeleton {
        max-width: 100%;
      }
      .placeholder_canvasControls {
        position: absolute;
        right: 20px;
        bottom: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 12px;
        background: var(--studio-loading-surface);
        border: 1px solid var(--studio-loading-border);
      }
      .placeholder_rightPanel {
        grid-area: rightPanel;
      }
      .placeholder_propertyGroup {
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        border-bottom: 1px solid var(--studio-loading-border);
      }
      .placeholder_fieldRow {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px;
        align-items: center;
      }
      .placeholder_field {
        height: 28px;
        border: 1px solid var(--studio-loading-fill);
        background: var(--studio-loading-layout);
        box-sizing: border-box;
        border-radius: 5px;
      }
      .placeholder_loadingStatus {
        position: absolute;
        z-index: 2;
        top: 76px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border: 1px solid var(--studio-loading-border);
        border-radius: 20px;
        font-size: 12px;
      }
      @keyframes placeholderPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .StudioPlaceholder {
          transition: none;
        }
        .placeholder_skeleton {
          animation: none;
        }
      }
      .placeholder_topBar { border-bottom: 1px solid var(--studio-loading-border); }
      .placeholder_leftToolbar,
      .placeholder_leftPanel,
      .placeholder_rightPanel {
        z-index: 1;
        margin: 12px 0 72px 12px;
        border: 1px solid var(--studio-loading-border);
        border-radius: 12px;
        box-shadow: 0 8px 24px #00000018;
      }
      .placeholder_rightPanel { margin-right: 12px; }
      .placeholder_canvasArea {
        background-image: radial-gradient(var(--studio-loading-border) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      @media (max-width: 1100px) {
        .StudioPlaceholder { grid-template-columns: 68px 0 minmax(0, 1fr) 344px; }
        .placeholder_leftPanel { display: none; }
        .placeholder_canvasArea { padding-left: 88px; }
      }
      @media (max-width: 640px) {
        .StudioPlaceholder { grid-template-columns: 68px 0 minmax(0, 1fr) 0; }
        .placeholder_rightPanel { display: none; }
        .placeholder_canvasArea { padding-right: 20px; }
        .placeholder_topBar > .placeholder_line--short { display: none; }
      }
</style></head><body>    <div class="StudioPlaceholder visible" aria-busy="true">
      <span class="placeholder_loadingStatus" role="status">Loading project…</span>
      <div class="placeholder_topBar" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="placeholder_icon"
          fill="none"
          viewBox="0 0 32 32"
          aria-hidden="true"
        >
          <path
            d="M3.2 22C3.2 14.93 8.93 9.2 16 9.2S28.8 14.93 28.8 22H32c0-8.837-7.163-16-16-16S0 13.163 0 22h3.2z"
            fill="currentColor"
          ></path>

          <path
            d="M24 22a8 8 0 10-16 0H4.8c0-6.185 5.015-11.2 11.2-11.2S27.2 15.815 27.2 22H24z"
            fill="currentColor"
          ></path>

          <path
            d="M12.8 22a3.2 3.2 0 016.4 0h3.2a6.4 6.4 0 10-12.8 0h3.2z"
            fill="currentColor"
          ></path>
        </svg>
        <span class="placeholder_skeleton placeholder_line--long"></span
        ><span class="placeholder_skeleton placeholder_line--short"></span>
        <div class="placeholder_actions">
          <span class="placeholder_skeleton placeholder_square"></span
          ><span class="placeholder_skeleton placeholder_button"></span
          ><span class="placeholder_skeleton placeholder_button"></span>
        </div>
      </div>
      <div class="placeholder_leftToolbar" aria-hidden="true">
        <span class="placeholder_skeleton placeholder_square"></span
        ><span class="placeholder_skeleton placeholder_square"></span
        ><span class="placeholder_skeleton placeholder_square"></span
        ><span class="placeholder_skeleton placeholder_square"></span
        ><span class="placeholder_skeleton placeholder_square"></span
        ><span
          class="placeholder_skeleton placeholder_square placeholder_toolbarBottom"
        ></span>
      </div>
      <div class="placeholder_leftPanel" aria-hidden="true">
        <div class="placeholder_panelHeader">
          <span class="placeholder_skeleton placeholder_line--medium"></span
          ><span class="placeholder_skeleton placeholder_square"></span>
        </div>
        <span class="placeholder_skeleton placeholder_search"></span>
        <div class="placeholder_tree">
          <div class="placeholder_treeRow">
            <span class="placeholder_skeleton placeholder_square"></span
            ><span class="placeholder_skeleton placeholder_line--long"></span>
          </div>
          <div class="placeholder_treeRow placeholder_treeRow--nested">
            <span class="placeholder_skeleton placeholder_square"></span
            ><span class="placeholder_skeleton placeholder_line--medium"></span>
          </div>
          <div class="placeholder_treeRow placeholder_treeRow--deep">
            <span class="placeholder_skeleton placeholder_square"></span
            ><span class="placeholder_skeleton placeholder_line--short"></span>
          </div>
          <div class="placeholder_treeRow placeholder_treeRow--deep">
            <span class="placeholder_skeleton placeholder_square"></span
            ><span class="placeholder_skeleton placeholder_line--medium"></span>
          </div>
          <div class="placeholder_treeRow placeholder_treeRow--nested">
            <span class="placeholder_skeleton placeholder_square"></span
            ><span class="placeholder_skeleton placeholder_line--long"></span>
          </div>
          <div class="placeholder_treeRow placeholder_treeRow--deep">
            <span class="placeholder_skeleton placeholder_square"></span
            ><span class="placeholder_skeleton placeholder_line--medium"></span>
          </div>
          <div class="placeholder_treeRow placeholder_treeRow--deep">
            <span class="placeholder_skeleton placeholder_square"></span
            ><span class="placeholder_skeleton placeholder_line--short"></span>
          </div>
          <div class="placeholder_treeRow">
            <span class="placeholder_skeleton placeholder_square"></span
            ><span class="placeholder_skeleton placeholder_line--medium"></span>
          </div>
        </div>
      </div>
      <div class="placeholder_canvasArea" aria-hidden="true">
        <div class="placeholder_artboard">
          <span class="placeholder_skeleton placeholder_line--medium"></span>
          <div class="placeholder_artboardSurface">
            <span class="placeholder_skeleton placeholder_line--long"></span>
            <span class="placeholder_skeleton placeholder_line--medium"></span>
            <span
              class="placeholder_skeleton placeholder_artboardContent"
            ></span>
            <span class="placeholder_skeleton placeholder_line--long"></span>
          </div>
        </div>
        <div class="placeholder_canvasControls">
          <span class="placeholder_skeleton placeholder_square"></span
          ><span class="placeholder_skeleton placeholder_line--short"></span
          ><span class="placeholder_skeleton placeholder_square"></span>
        </div>
      </div>
      <div class="placeholder_rightPanel" aria-hidden="true">
        <div class="placeholder_panelHeader">
          <span class="placeholder_skeleton placeholder_line--medium"></span
          ><span class="placeholder_skeleton placeholder_square"></span>
        </div>
        <div class="placeholder_propertyGroup">
          <span class="placeholder_skeleton placeholder_line--short"></span>
          <div class="placeholder_fieldRow">
            <span class="placeholder_skeleton placeholder_line--short"></span
            ><span class="placeholder_skeleton placeholder_field"></span
            ><span class="placeholder_skeleton placeholder_field"></span>
          </div>
          <div class="placeholder_fieldRow">
            <span class="placeholder_skeleton placeholder_line--short"></span
            ><span class="placeholder_skeleton placeholder_field"></span
            ><span class="placeholder_skeleton placeholder_field"></span>
          </div>
        </div>
        <div class="placeholder_propertyGroup">
          <span class="placeholder_skeleton placeholder_line--short"></span>
          <div class="placeholder_fieldRow">
            <span class="placeholder_skeleton placeholder_line--short"></span
            ><span class="placeholder_skeleton placeholder_field"></span
            ><span class="placeholder_skeleton placeholder_field"></span>
          </div>
          <div class="placeholder_fieldRow">
            <span class="placeholder_skeleton placeholder_line--short"></span
            ><span class="placeholder_skeleton placeholder_field"></span
            ><span class="placeholder_skeleton placeholder_field"></span>
          </div>
        </div>
        <div class="placeholder_propertyGroup">
          <span class="placeholder_skeleton placeholder_line--short"></span>
          <div class="placeholder_fieldRow">
            <span class="placeholder_skeleton placeholder_line--short"></span
            ><span class="placeholder_skeleton placeholder_field"></span
            ><span class="placeholder_skeleton placeholder_field"></span>
          </div>
          <div class="placeholder_fieldRow">
            <span class="placeholder_skeleton placeholder_line--short"></span
            ><span class="placeholder_skeleton placeholder_field"></span
            ><span class="placeholder_skeleton placeholder_field"></span>
          </div>
        </div>
      </div>
    </div>
<select aria-label="Appearance" style="position:fixed;right:20px;top:16px;z-index:10" onchange="document.documentElement.dataset.uiAppearance=this.value"><option value="dark">Dark</option><option value="light">Light</option></select></body></html>
